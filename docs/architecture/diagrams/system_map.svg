</style><text x="480.0" y="28.0" font-size="18" class="t" text-anchor="middle">Founder</text><text x="480.0" y="53.6" font-size="13.5" class="x" text-anchor="middle">Asks Second-Soul for work, or starts a subscription-agent session, and makes the decisions</text><path d="M480.0 73.675v18M475.0 86.675l5 5 5-5" class="ln" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="8.0" y="103.675" width="466.0" height="126.9" rx="8" class="card"/><rect x="20.0" y="103.675" width="442.0" height="2.5" rx="1.25" class="f-blue"/><g transform="translate(231.0,119.675) scale(0.84)" fill="none" class="s-blue" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4zM9 9h6v6H9zM9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3"/></g><text x="241.0" y="165.7" font-size="16" class="t" text-anchor="middle">Hermes agents</text><text x="241.0" y="189.9" font-size="13" class="x" text-anchor="middle">Second-Soul supervisor dispatches kanban tasks to gtm-manager,</text><text x="241.0" y="208.7" font-size="13" class="x" text-anchor="middle">marketing-executive and code-sentinel. Local Docker.</text><rect x="486.0" y="103.675" width="466.0" height="126.9" rx="8" class="card"/><rect x="498.0" y="103.675" width="442.0" height="2.5" rx="1.25" class="f-blue"/><g transform="translate(709.0,119.675) scale(0.84)" fill="none" class="s-blue" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/></g><text x="719.0" y="165.7" font-size="16" class="t" text-anchor="middle">Subscription agents</text><text x="719.0" y="189.9" font-size="13" class="x" text-anchor="middle">Claude, ChatGPT and Codex sessions using the horology-tools,</text><text x="719.0" y="208.7" font-size="13" class="x" text-anchor="middle">horology-document-graph and horology-workflows plugins</text><path d="M480.0 240.575v18M475.0 253.575l5 5 5-5" class="ln" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="494.0" y="253.575" font-size="11.5" class="x">MCP over HTTP, Google sign-in in the cloud</text><rect x="8" y="270.575" width="944" height="208.25" rx="12" class="group"/><text x="24" y="292.575" font-size="10.5" class="m f-purple">MCP SERVICES · CLOUD RUN (HOROLOGY-DEV) · LOCAL CONTAINERS FOR HERMES</text><rect x="22.0" y="304.575" width="297.3" height="160.2" rx="8" class="card"/><rect x="34.0" y="304.575" width="273.3" height="2.5" rx="1.25" class="f-purple"/><g transform="translate(160.7,320.575) scale(0.84)" fill="none" class="s-purple" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 11h14v10H5zM8 11V7a4 4 0 0 1 8 0v4"/></g><text x="170.7" y="365.6" font-size="15" class="t" text-anchor="middle">MCP gateway</text><text x="170.7" y="388.8" font-size="12.5" class="x" text-anchor="middle">14 capped tools: Supabase metadata,</text><text x="170.7" y="406.9" font-size="12.5" class="x" text-anchor="middle">Tavily search, Firecrawl scrape and</text><text x="170.7" y="425.1" font-size="12.5" class="x" text-anchor="middle">Alexandria reads. Shared policy and</text><text x="170.7" y="443.2" font-size="12.5" class="x" text-anchor="middle">credit budgets.</text><rect x="331.3" y="304.575" width="297.3" height="160.2" rx="8" class="card"/><rect x="343.3" y="304.575" width="273.3" height="2.5" rx="1.25" class="f-purple"/><g transform="translate(470.0,320.575) scale(0.84)" fill="none" class="s-purple" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.3-4.3"/></g><text x="480.0" y="365.6" font-size="15" class="t" text-anchor="middle">Document graph</text><text x="480.0" y="388.8" font-size="12.5" class="x" text-anchor="middle">15 tools: passage search, topics,</text><text x="480.0" y="406.9" font-size="12.5" class="x" text-anchor="middle">entities, links, write and sync</text><rect x="640.7" y="304.575" width="297.3" height="16