</style><text x="480.0" y="28.0" font-size="18" class="t" text-anchor="middle">Add the connector</text><text x="480.0" y="53.6" font-size="13.5" class="x" text-anchor="middle">A Claude, ChatGPT or Codex client is given the gateway or document-graph /mcp URL</text><path d="M480.0 73.675v18M475.0 86.675l5 5 5-5" class="ln" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="8.0" y="103.675" width="944.0" height="108.0" rx="8" class="card"/><rect x="20.0" y="103.675" width="920.0" height="2.5" rx="1.25" class="f-purple"/><g transform="translate(470.0,119.675) scale(0.84)" fill="none" class="s-purple" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v12M18 9a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM6 21a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM18 9a9 9 0 0 1-9 9"/></g><text x="480.0" y="165.7" font-size="16" class="t" text-anchor="middle">Discover and register</text><text x="480.0" y="189.9" font-size="13" class="x" text-anchor="middle">The client reads the OAuth metadata and registers itself dynamically</text><path d="M480.0 221.725v18M475.0 234.725l5 5 5-5" class="ln" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="8.0" y="251.725" width="944.0" height="108.0" rx="8" class="card"/><rect x="20.0" y="251.725" width="920.0" height="2.5" rx="1.25" class="f-blue"/><g transform="translate(470.0,267.725) scale(0.84)" fill="none" class="s-blue" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/></g><text x="480.0" y="313.7" font-size="16" class="t" text-anchor="middle">Google sign-in</text><text x="480.0" y="337.9" font-size="13" class="x" text-anchor="middle">openid and email only. Only Google Auth Platform Audience test users can finish it.</text><path d="M480.0 369.775v18M475.0 382.775l5 5 5-5" class="ln" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="8.0" y="399.775" width="944.0" height="108.0" rx="8" class="card"/><rect x="20.0" y="399.775" width="920.0" height="2.5" rx="1.25" class="f-purple"/><g transform="translate(470.0,415.775) scale(0.84)" fill="none" class="s-purple" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0zM8 12l3 3 5-6"/></g><text x="480.0" y="461.8" font-size="16" class="t" text-anchor="middle">Horology consent page</text><text x="480.0" y="486.0" font-size="13" class="x" text-anchor="middle">Shows the client, the signed-in account and what the connection can do. Allow access issues a code.</text><path d="M480.0 517.825v18M475.0 530.825l5 5 5-5" class="ln" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="8.0" y="547.825" width="944.0" height="108.0" rx="8" class="card"/><rect x="20.0" y="547.825" width="920.0" height="2.5" rx="1.25" class="f-purple"/><g transform="translate(470.0,563.825) scale(0.84)" fill="none" class="s-purple" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 17.5a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9zM11.5 11.5L21 2M17 6l3 3M14.5 8.5l2.5 2.5"/></g><text x="480.0" y="609.8" font-size="16" class="t" text-anchor="middle">Token exchange with PKCE</text><text x="480.0" y="634.0" font-size="13" class="x" text-anchor="middle">Access and refresh tokens, stored hashed in gateway_auth.records or graph_auth.records</text><path d="M480.0 665.875v18M475.0 678.875l5 5 5-5" class="ln" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="8" y="695.875" width="944" height="174.89999999999998" rx="12" class="group"/><text x="24" y="717.875" font-size="10.5" class="m f-green">EVERY TOOL CALL</text><rect x="22.0" y="729.875" width="452.0" height="126.9" rx="8" class="card"/><rect x="34.0" y="729.875" width="428.0" height="2.5" rx="1.25" class="f-green"/><g transform="translate(238.0,745.875) scale(0.84)" fill="none" class="s-green" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 11h14v10H5zM8 11V7a4 4 0 0 1 8 0v4"/></g><text x="248.0" y="791.9" font-size="16" class="t" text-anchor="middle">Gateway</text><text x="248.0" y="816.1" font-size="13" class="x" text-anchor="middle">Token → shared policy → atomic credit reservation → provider</text><text x="248.0" y="834.9" font-size="13" class="x" text-anchor="middle">call → bounded result</text><rect x="486.0" y="729.875" width="452.0" height="126.9" rx="8" class="card"/><rect x="498.0" y="729.875" width="428.0" height="2.5" rx="1.25" class="f-green"/><g transform="translate(702.0,745.875) scale(0.84)" fill="none" class="s-green" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.3-4.3"/></g><text x="712.0" y="791.9" font-size="16" class="t" text-anchor="middle">Document graph</text><text x="712.0" y="816.1" font-size="13" class="x" text-anchor="middle">Token → the workspace picked at sign-in, re-checked against</text><text x="712.0" y="834.9" font-size="13" class="x" text-anchor="middle">the users tables → every query filtered by it</text></svg>
