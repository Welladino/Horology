</style><text x="480.0" y="28.0" font-size="18" class="t" text-anchor="middle">Founder</text><text x="480.0" y="53.6" font-size="13.5" class="x" text-anchor="middle">Talks only to Second-Soul, through the Hermes dashboard or API on localhost</text><path d="M480.0 73.675v18M475.0 86.675l5 5 5-5" class="ln" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="8.0" y="103.675" width="944.0" height="108.0" rx="8" class="card"/><rect x="20.0" y="103.675" width="920.0" height="2.5" rx="1.25" class="f-blue"/><g transform="translate(470.0,119.675) scale(0.84)" fill="none" class="s-blue" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4zM9 9h6v6H9zM9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3"/></g><text x="480.0" y="165.7" font-size="16" class="t" text-anchor="middle">Second-Soul</text><text x="480.0" y="189.9" font-size="13" class="x" text-anchor="middle">Supervisor profile. Reads the subagent index, splits work and creates kanban tasks. 150-turn limit.</text><path d="M480.0 221.725v18M475.0 234.725l5 5 5-5" class="ln" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="494.0" y="234.725" font-size="11.5" class="x">hermes kanban create --assignee &lt;profile&gt;</text><rect x="8" y="251.725" width="944" height="172.0" rx="12" class="group"/><text x="24" y="273.725" font-size="10.5" class="m f-blue">SUBAGENT PROFILES · 50-TURN LIMIT EACH</text><rect x="22.0" y="285.725" width="297.3" height="124.0" rx="8" class="card"/><rect x="34.0" y="285.725" width="273.3" height="2.5" rx="1.25" class="f-blue"/><g transform="translate(160.7,301.725) scale(0.84)" fill="none" class="s-blue" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/></g><text x="170.7" y="346.7" font-size="15" class="t" text-anchor="middle">gtm-manager</text><text x="170.7" y="370.0" font-size="12.5" class="x" text-anchor="middle">Positioning, channels and sequencing</text><rect x="331.3" y="285.725" width="297.3" height="124.0" rx="8" class="card"/><rect x="343.3" y="285.725" width="273.3" height="2.5" rx="1.25" class="f-blue"/><g transform="translate(470.0,301.725) scale(0.84)" fill="none" class="s-blue" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/></g><text x="480.0" y="346.7" font-size="15" class="t" text-anchor="middle">marketing-executive</text><text x="480.0" y="370.0" font-size="12.5" class="x" text-anchor="middle">Copy, drafts and campaigns</text><rect x="640.7" y="285.725" width="297.3" height="124.0" rx="8" class="card"/><rect x="652.7" y="285.725" width="273.3" height="2.5" rx="1.25" class="f-blue"/><g transform="translate(779.3,301.725) scale(0.84)" fill="none" class="s-blue" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></g><text x="789.3" y="346.7" font-size="15" class="t" text-anchor="middle">code-sentinel</text><text x="789.3" y="370.0" font-size="12.5" class="x" text-anchor="middle">Repository health; blocks when no</text><text x="789.3" y="388.1" font-size="12.5" class="x" text-anchor="middle">read-only repository access exists</text><path d="M480.0 433.725v18M475.0 446.725l5 5 5-5" class="ln" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="494.0" y="446.725" font-size="11.5" class="x">kanban_complete or kanban_block closes every task</text><rect x="8" y="463.725" width="944" height="174.89999999999998" rx="12" class="group"/><text x="24" y="485.725" font-size="10.5" class="m f-purple">LOCAL MCP CONTAINERS · DOCKER NETWORK HOROLOGY_DEFAULT</text><rect x="22.0" y="497.725" width="452.0" height="126.9" rx="8" class="card"/><rect x="34.0" y="497.725" width="428.0" height="2.5" rx="1.25" class="f-purple"/><g transform="translate(238.0,513.725) scale(0.84)" f