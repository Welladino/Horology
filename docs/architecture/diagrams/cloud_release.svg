(0.84)" fill="none" class="s-green" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 11h14v10H5zM8 11V7a4 4 0 0 1 8 0v4"/></g><text x="170.7" y="712.9" font-size="15" class="t" text-anchor="middle">mcp-gateway</text><text x="170.7" y="736.1" font-size="12.5" class="x" text-anchor="middle">Public HTTPS, MCP tools need OAuth. 1</text><text x="170.7" y="754.2" font-size="12.5" class="x" text-anchor="middle">CPU, 512 MiB, 4 requests per instance.</text><rect x="331.3" y="651.85" width="297.3" height="124.0" rx="8" class="card"/><rect x="343.3" y="651.85" width="273.3" height="2.5" rx="1.25" class="f-green"/><g transform="translate(470.0,667.85) scale(0.84)" fill="none" class="s-green" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.3-4.3"/></g><text x="480.0" y="712.9" font-size="15" class="t" text-anchor="middle">document-graph</text><text x="480.0" y="736.1" font-size="12.5" class="x" text-anchor="middle">Public HTTPS, MCP tools need OAuth.</text><text x="480.0" y="754.2" font-size="12.5" class="x" text-anchor="middle">Starts the sync job.</text><rect x="640.7" y="651.85" width="297.3" height="124.0" rx="8" class="card"/><rect x="652.7" y="651.85" width="273.3" height="2.5" rx="1.25" class="f-green"/><g transform="translate(779.3,667.85) scale(0.84)" fill="none" class="s-green" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 6v6l4 2"/></g><text x="789.3" y="712.9" font-size="15" class="t" text-anchor="middle">document-graph-sync job</text><text x="789.3" y="736.1" font-size="12.5" class="x" text-anchor="middle">Same image, python -m graph_sync,</text><text x="789.3" y="754.2" font-size="12.5" class="x" text-anchor="middle">60-minute limit, no retries</text></svg>
