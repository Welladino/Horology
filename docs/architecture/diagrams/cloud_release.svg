</style><text x="480.0" y="28.0" font-size="18" class="t" text-anchor="middle">Source</text><text x="480.0" y="53.6" font-size="13.5" class="x" text-anchor="middle">GitHub for version control; releases are submitted from local source by the impersonated horology-deployer</text><path d="M480.0 73.675v18M475.0 86.675l5 5 5-5" class="ln" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="8" y="103.675" width="944" height="326.125" rx="12" class="group"/><text x="24" y="125.675" font-size="10.5" class="m f-blue">GATES · SAME CHECKS IN CLOUD BUILD AND GITHUB ACTIONS</text><rect x="22.0" y="137.675" width="297.3" height="142.1" rx="8" class="card"/><rect x="34.0" y="137.675" width="273.3" height="2.5" rx="1.25" class="f-blue"/><g transform="translate(160.7,153.675) scale(0.84)" fill="none" class="s-blue" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></g><text x="170.7" y="198.7" font-size="15" class="t" text-anchor="middle">Source scan</text><text x="170.7" y="221.9" font-size="12.5" class="x" text-anchor="middle">Trivy secrets and Dockerfile</text><text x="170.7" y="240.1" font-size="12.5" class="x" text-anchor="middle">configuration; gitleaks history on</text><text x="170.7" y="258.2" font-size="12.5" class="x" text-anchor="middle">GitHub</text><rect x="331.3" y="137.675" width="297.3" height="142.1" rx="8" class="card"/><rect x="343.3" y="137.675" width="273.3" height="2.5" rx="1.25" class="f-blue"/><g transform="translate(470.0,153.675) scale(0.84)" fill="none" class="s-blue" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0zM8 12l3 3 5-6"/></g><text x="480.0" y="198.7" font-size="15" class="t" text-anchor="middle">Tests</text><text x="480.0" y="221.9" font-size="12.5" class="x" text-anchor="middle">Unit and integration against disposable</text><text x="480.0" y="240.1" font-size="12.5" class="x" text-anchor="middle">PostgreSQL</text><rect x="640.7" y="137.675" width="297.3" height="142.1" rx="8" class="card"/><rect x="652.7" y="137.675" width="273.3" height="2.5" rx="1.25" class="f-blue"/><g transform="translate(779.3,153.675) scale(0.84)" fill="none" class="s-blue" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.3-4.3"/></g><text x="789.3" y="198.7" font-size="15" class="t" text-anchor="middle">Audits</text><text x="789.3" y="221.9" font-size="12.5" class="x" text-anchor="middle">Bandit and pip-audit</text><rect x="22.0" y="291.8" width="297.3" height="124.0" rx="8" class="card"/><rect x="34.0" y="291.8" width="273.3" height="2.5" rx="1.25" class="f-blue"/><g transform="translate(160.7,307.8) scale(0.84)" fill="none" class="s-blue" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8l-9-5-9 5v8l9 5 9-5zM3.3 7L12 12l8.7-5M12 22V12"/></g><text x="170.7" y="352.8" font-size="15" class="t" text-anchor="middle">Build both images</text><text x="170.7" y="376.1" font-size="12.5" class="x" text-anchor="middle">Gateway and document graph (which also</text><text x="170.7" y="394.2" font-size="12.5" class="x" text-anchor="middle">carries the sync job)</text><rect x="331.3" y="291.8" width="297.3" height="124.0" rx="8" class="card"/><rect x="343.3" y="291.8" width="273.3" height="2.5" rx="1.25" class="f-blue"/><g transform="translate(470.0,307.8) scale(0.84)" fill="none" class="s-blue" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 11h14v10H5zM8 11V7a4 4 0 0 1 8 0v4"/></g><text x="480.0" y="352.8" font-size="15" class="t" text-anchor="middle">Image contract</text><text x="480.0" y="376.1" font-size="12.5" class="x" text-anchor="middle">Non-root, required assets, no local</text><text x="480.0" y="394.2" font-size="12.5" class="x" text-anchor="middle">credential files</text><rect x="640.7" y="291.8" width="297.3" height="124.0" rx="8" class="ca