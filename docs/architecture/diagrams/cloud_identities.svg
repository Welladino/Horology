</style><rect x="8" y="8" width="944" height="172.0" rx="12" class="group"/><text x="24" y="30" font-size="10.5" class="m f-blue">PEOPLE</text><rect x="22.0" y="42" width="297.3" height="124.0" rx="8" class="card"/><rect x="34.0" y="42" width="273.3" height="2.5" rx="1.25" class="f-blue"/><g transform="translate(160.7,58) scale(0.84)" fill="none" class="s-blue" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/></g><text x="170.7" y="103.0" font-size="15" class="t" text-anchor="middle">Daily account</text><text x="170.7" y="126.2" font-size="12.5" class="x" text-anchor="middle">Views the project; impersonates</text><text x="170.7" y="144.4" font-size="12.5" class="x" text-anchor="middle">horology-deployer for builds and deploys</text><rect x="331.3" y="42" width="297.3" height="124.0" rx="8" class="card"/><rect x="343.3" y="42" width="273.3" height="2.5" rx="1.25" class="f-blue"/><g transform="translate(470.0,58) scale(0.84)" fill="none" class="s-blue" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></g><text x="480.0" y="103.0" font-size="15" class="t" text-anchor="middle">Protected administrator</text><text x="480.0" y="126.2" font-size="12.5" class="x" text-anchor="middle">IAM and infrastructure changes only,</text><text x="480.0" y="144.4" font-size="12.5" class="x" text-anchor="middle">through the horology-admin profile</text><rect x="640.7" y="42" width="297.3" height="124.0" rx="8" class="card"/><rect x="652.7" y="42" width="273.3" height="2.5" rx="1.25" class="f-blue"/><g transform="translate(779.3,58) scale(0.84)" fill="none" class="s-blue" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0zM8 12l3 3 5-6"/></g><text x="789.3" y="103.0" font-size="15" class="t" text-anchor="middle">Audience test users</text><text x="789.3" y="126.2" font-size="12.5" class="x" text-anchor="middle">The only Google accounts that can sign</text><text x="789.3" y="144.4" font-size="12.5" class="x" text-anchor="middle">in to either MCP service</text><path d="M480.0 190.0v18M475.0 203.0l5 5 5-5" class="ln" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="8" y="220.0" width="944" height="310.9" rx="12" class="group"/><text x="24" y="242.0" font-size="10.5" class="m f-purple">SERVICE ACCOUNTS</text><rect x="22.0" y="254.0" width="452.0" height="126.9" rx="8" class="card"/><rect x="34.0" y="254.0" width="428.0" height="2.5" rx="1.25" class="f-purple"/><g transform="translate(238.0,270.0) scale(0.84)" fill="none" class="s-purple" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 17.5a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9zM11.5 11.5L21 2M17 6l3 3M14.5 8.5l2.5 2.5"/></g><text x="248.0" y="316.0" font-size="16" class="t" text-anchor="middle">horology-deployer</text><text x="248.0" y="340.2" font-size="13" class="x" text-anchor="middle">Submits builds, updates the services, tags images</text><rect x="486.0" y="254.0" width="452.0" height="126.9" rx="8" class="card"/><rect x="498.0" y="254.0" width="428.0" height="2.5" rx="1.25" class="f-purple"/><g transform="translate(702.0,270.0) scale(0.84)" fill="none" class="s-purple" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8l-9-5-9 5v8l9 5 9-5zM3.3 7L12 12l8.7-5M12 22V12"/></g><text x="712.0" y="316.0" font-size="16" class="t" text-anchor="middle">mcp-build</text><text x="712.0" y="340.2" font-size="13" class="x" text-anchor="middle">Runs the gates and publishes images; no secrets, no deploy</text><text x="712.0" y="359.1" font-size="13" class="x" text-anchor="middle">rights</text><rect x="22.0" y="392.9" width="297.3" height="124.0" rx="8" class="card"/><rect x="34.0" y="392.9" width="273.3" height="2.5" rx="1.25" class="f-purple"/><g transform="translate(160.7,408.9) scale(0.84)" fill="none" class="s-purple" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 11h14v10H5zM8 11V7a4 4 0 0 1 8 0v4"/></g><text x="170.7" y="453.9" font-size="15" class="t" text-anchor="middle">mcp-gateway</text><text x="170.7" y="477.1" font-size="12.5" class="x" text-anchor="middle">Reads only the gateway&#x27;s secrets</text><rect x="331.3" y="392.9" width="297.3" height="124.0" rx="8" class="card"/><rect x="343.3" y="392.9" width="273.3" height="2.5" rx="1.25" class="f-purple"/><g transform="translate(470.0,408.9) scale(0.84)" fill="none" class="s-purple" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.3-4.3"/></g><text x="480.0" y="453.9" font-size="15" class="t" text-anchor="middle">document-graph</text><text x="480.0" y="477.1" font-size="12.5" class="x" text-anchor="middle">Reads its secrets and starts the sync</text><text x="480.0" y="495.3" font-size="12.5" class="x" text-anchor="middle">job</text><rect x="640.7" y="392.9" width="297.3" height="124.0" rx="8" class="card"/><rect x="652.7" y="392.9" width="273.3" height="2.5" rx="1.25" class="f-purple"/><g transform="translate(779.3,408.9) scale(0.84)" fill="none" class="s-purple" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 6v6l4 2"/></g><text x="789.3" y="453.9" font-size="15" class="t" text-anchor="middle">document-graph-sync</text><text x="789.3" y="477.1" font-size="12.5" class="x" text-anchor="middle">Reads shared Drive folders and writes</text><text x="789.3" y="495.3" font-size="12.5" class="x" text-anchor="middle">the Document Index</text><path d="M480.0 540.9v18M475.0 553.9l5 5 5-5" class="ln" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="8.0" y="570.9" width="944.0" height="108.0" rx="8" class="card"/><rect x="20.0" y="570.9" width="920.0" height="2.5" rx="1.25" class="f-green"/><g transform="translate(470.0,586.9) scale(0.84)" fill="none" class="s-green" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 17.5a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9zM11.5 11.5L21 2M17 6l3 3M14.5 8.5l2.5 2.5"/></g><text x="480.0" y="632.9" font-size="16" class="t" text-anchor="middle">Secret Manager</text><text x="480.0" y="657.1" font-size="13" class="x" text-anchor="middle">Provider keys, database logins and the Google OAuth client, as pinned versions per service</text></svg>
