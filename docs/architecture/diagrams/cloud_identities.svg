<svg xmlns="http://www.w3.org/2000/svg" width="960" height="686" viewBox="0 0 960 686" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif"><style>
