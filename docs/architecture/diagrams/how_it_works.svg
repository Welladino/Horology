<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1103" viewBox="0 0 960 1103" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif"><style>
.card{fill:#ffffff;stroke:#d1d9e0}
.group{fill:#f6f8fa;fill-opacity:.6;stroke:#d1d9e0;stroke-dasharray:5 4}
.t{fill:#1f2328;font-weight:600}
.x{fill:#59636e}
.m{fill:#59636e;font-weight:600;letter-spacing:1.6px}
.ln{stroke:#818b98;fill:none}
.s-blue{stroke:#0969da}.f-blue{fill:#0969da}.s-purple{stroke:#8250df}.f-purple{fill:#8250df}.s-green{stroke:#1a7f37}.f-green{fill:#1a7f37}.s-orange{stroke:#bc4c00}.f-orange{fill:#bc4c00}.s-grey{stroke:#59636e}.f-grey{fill:#59636e}
@media (prefers-color-scheme:dark){
.card{fill:#151b23;stroke:#3d444d}
.group{fill:#0d1117;fill-opacity:.6;stroke:#3d444d}
.t{fill:#f0f6fc}
.x{fill:#9198a1}
.m{fill:#9198a1}
.ln{stroke:#656c76}
.s-blue{stroke:#4493f8}.f-blue{fill:#4493f8}.s-purple{stroke:#ab7df8}.f-purple{fill:#ab7df8}.s-green{stroke:#3fb950}.f-green{fill:#3fb950}.s-orange{stroke:#f0883e}.f-orange{fill:#f0883e}.s-grey{stroke:#9198a1}.f-grey{fill:#9198a1}
}
</style><text x="480.0" y="28.0" font-size="20" class="t" text-anchor="middle">How Horology works</text><text x="480.0" y="54.5" font-size="13.5" class="x" text-anchor="middle">One Pipeline item, start to finish</text><rect x="8.0" y="80.575" width="944.0" height="108.0" rx="8" class="card"/><rect x="20.0" y="80.575" width="920.0" height="2.5" rx="1.25" class="f-grey"/><g transform="translate(470.0,96.575) scale(0.84)" fill="none" class="s-grey" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/></g><text x="480.0" y="142.6" font-size="16" class="t" text-anchor="middle">1. You pick the work</text><text x="480.0" y="166.8" font-size="13" class="x" text-anchor="middle">In Pipeline Master, set Agent status to Plan (needs scoping) or Ready (run it). Choose Agent type and Run location.</text><path d="M480.0 198.625v18M475.0 211.625l5 5 5-5" class="ln" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="8.0" y="228.625" width="466.0" height="126.9" rx="8" class="card"/><rect x="20.0" y="228.625" width="442.0" height="2.5" rx="1.25" class="f-purple"/><g transform="translate(231.0,244.625) scale(0.84)" fill="none" class="s-purple" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v12M18 9a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM6 21a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM18 9a9 9 0 0 1-9 9"/></g><text x="241.0" y="290.6" font-size="16" class="t" text-anchor="middle">2a. Plan → Planner</text><text x="241.0" y="314.8" font-size="13" class="x" text-anchor="middle">Rewrites Next step as a sharper question or numbered steps,</text><text x="241.0" y="333.7" font-size="13" class="x" text-anchor="middle">then sets it back to No action. You review and set Ready.</text><rect x="486.0" y="228.625" width="466.0" height="126.9" rx="8" class="card"/><rect x="498.0" y="228.625" width="442.0" height="2.5" rx="1.25" class="f-purple"/><g transform="translate(709.0,244.625) scale(0.84)" fill="none" class="s-purple" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6M1 20v-6h6M3.5 9a9 9 0 0 1 14.9-3.4L23 10M1 14l4.6 4.4A9 9 0 0 0 20.5 15"/></g><text x="719.0" y="290.6" font-size="16" class="t" text-anchor="middle">2b. Ready → Supervisor</text><text x="719.0" y="314.8" font-size="13" class="x" text-anchor="middle">You ask a Claude Code or Codex session to run the Ready items.</text><text x="719.0" y="333.7" font-size="13" class="x" text-anchor="middle">It claims each one and starts one session per item.</text><path d="M480.0 365.525v18M475.0 378.525l5 5 5-5" class="ln" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="494.0" y="378.525" font-size="11.5" class="x">Ready items</text><rect x="8.0" y="395.525" width="944.0" height="108.0" rx="8" class="card"/><rect x="20.0" y="395.525" width="920.0" height="2.5" rx="1.25" class="f-purple"/><g transform="translate(470.0,411.525) scale(0.84)" fill="none" class="s-purple" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4zM9 9h6v6H9zM9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3"/></g><text x="480.0" y="457.5" font-size="16" class="t" text-anchor="middle">3. Specialists do the work</text><text x="480.0" y="481.7" font-size="13" class="x" text-anchor="middle">Research, technical assessment, security, GTM, marketing, content. The supervisor checks the results, then finishes the run.</text><path d="M480.0 513.575v18M475.0 526.575l5 5 5-5" class="ln" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="494.0" y="526.575" font-size="11.5" class="x">save</text><rect x="8.0" y="543.575" width="944.0" height="108.0" rx="8" class="card"/><rect x="20.0" y="543.575" width="920.0" height="2.5" rx="1.25" class="f-grey"/><g transform="translate(470.0,559.575) scale(0.84)" fill="none" class="s-grey" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M8 13h8M8 17h8"/></g><text x="480.0" y="605.6" font-size="16" class="t" text-anchor="middle">4. Results land where you see them</text><text x="480.0" y="629.8" font-size="13" class="x" text-anchor="middle">Drive documents, Document Index rows and a proposed decision. The item moves to Awaiting decision.</text><path d="M480.0 661.625v18M475.0 674.625l5 5 5-5" class="ln" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="494.0" y="674.625" font-size="11.5" class="x">read by</text><rect x="8.0" y="691.625" width="944.0" height="108.0" rx="8" class="card"/><rect x="20.0" y="691.625" width="920.0" height="2.5" rx="1.25" class="f-green"/><g transform="translate(470.0,707.625) scale(0.84)" fill="none" class="s-green" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8c5 0 9-1.3 9-3s-4-3-9-3-9 1.3-9 3 4 3 9 3zM21 12c0 1.7-4 3-9 3s-9-1.3-9-3M3 5v14c0 1.7 4 3 9 3s9-1.3 9-3V5"/></g><text x="480.0" y="753.6" font-size="16" class="t" text-anchor="middle">5. Sync job records what happened</text><text x="480.0" y="777.8" font-size="13" class="x" text-anchor="middle">No AI. Copies the sheets into Neon, notes every change, links outputs to the run, and checks moves against workflow.yaml.</text><path d="M480.0 809.675v18M475.0 822.675l5 5 5-5" class="ln" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="494.0" y="822.675" font-size="11.5" class="x">read by</text><rect x="8.0" y="839.675" width="944.0" height="108.0" rx="8" class="card"/><rect x="20.0" y="839.675" width="920.0" height="2.5" rx="1.25" class="f-blue"/><g transform="translate(470.0,855.675) scale(0.84)" fill="none" class="s-blue" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 6v6l4 2"/></g><text x="480.0" y="901.7" font-size="16" class="t" text-anchor="middle">6. Daily digest reports back</text><text x="480.0" y="925.9" font-size="13" class="x" text-anchor="middle">A Google Doc: counts, what finished, what&#x27;s waiting on you, and anything that looks wrong.</text><path d="M480.0 957.7249999999999v18M475.0 970.7249999999999l5 5 5-5" class="ln" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="494.0" y="970.7249999999999" font-size="11.5" class="x">you decide</text><rect x="8.0" y="987.7249999999999" width="944.0" height="108.0" rx="8" class="card"/><rect x="20.0" y="987.7249999999999" width="920.0" height="2.5" rx="1.25" class="f-grey"/><g transform="translate(470.0,1003.7249999999999) scale(0.84)" fill="none" class="s-grey" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0zM8 12l3 3 5-6"/></g><text x="480.0" y="1049.7" font-size="16" class="t" text-anchor="middle">7. You decide</text><text x="480.0" y="1073.9" font-size="13" class="x" text-anchor="middle">Accept, rework, park or reject in the Decision Register. Rework makes the item Ready again.</text></svg>
