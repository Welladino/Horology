</style><rect x="8" y="8" width="944" height="174.89999999999998" rx="12" class="group"/><text x="24" y="30" font-size="10.5" class="m f-orange">TWO WAYS IN</text><rect x="22.0" y="42" width="452.0" height="126.9" rx="8" class="card"/><rect x="34.0" y="42" width="428.0" height="2.5" rx="1.25" class="f-orange"/><g transform="translate(238.0,58) scale(0.84)" fill="none" class="s-orange" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4zM9 9h6v6H9zM9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3"/></g><text x="248.0" y="104.0" font-size="16" class="t" text-anchor="middle">write_document</text><text x="248.0" y="128.2" font-size="13" class="x" text-anchor="middle">An agent saves a finished output; source = agent</text><rect x="486.0" y="42" width="452.0" height="126.9" rx="8" class="card"/><rect x="498.0" y="42" width="428.0" height="2.5" rx="1.25" class="f-orange"/><g transform="translate(702.0,58) scale(0.84)" fill="none" class="s-orange" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M8 13h8M8 17h8"/></g><text x="712.0" y="104.0" font-size="16" class="t" text-anchor="middle">Graph sync job</text><text x="712.0" y="128.2" font-size="13" class="x" text-anchor="middle">Document Index rows with Graph Inclusion TRUE; source =</text><text x="712.0" y="147.0" font-size="13" class="x" text-anchor="middle">sheet. Only files whose Drive revision changed.</text><path d="M480.0 192.89999999999998v18M475.0 205.89999999999998l5 5 5-5" class="ln" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="8.0" y="222.89999999999998" width="306.7" height="124.0" rx="8" class="card"/><rect x="20.0" y="222.89999999999998" width="282.7" height="2.5" rx="1.25" class="f-purple"/><g transform="translate(151.3,238.89999999999998) scale(0.84)" fill="none" class="s-purple" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8l-9-5-9 5v8l9 5 9-5zM3.3 7L12 12l8.7-5M12 22V12"/></g><text x="161.3" y="283.9" font-size="15" class="t" text-anchor="middle">Split into sections</text><text x="161.3" y="307.1" font-size="12.5" class="x" text-anchor="middle">Up to 2,000 characters each, at most 30</text><text x="161.3" y="325.3" font-size="12.5" class="x" text-anchor="middle">per document, else rejected as too_long</text><rect x="326.7" y="222.89999999999998" width="306.7" height="124.0" rx="8" class="card"/><rect x="338.7" y="222.89999999999998" width="282.7" height="2.5" rx="1.25" class="f-purple"/><g transform="translate(470.0,238.89999999999998) scale(0.84)" fill="none" class="s-purple" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 10h-1.3A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></g><text x="480.0" y="283.9" font-size="15" class="t" text-anchor="middle">Embed</text><text x="480.0" y="307.1" font-size="12.5" class="x" text-anchor="middle">768-dimension Gemini embeddings through</text><text x="480.0" y="325.3" font-size="12.5" class="x" text-anchor="middle">OpenRouter, per section and per document</text><rect x="645.3" y="222.89999999999998" width="306.7" height="124.0" rx="8" class="card"/><rect x="657.3" y="222.89999999999998" width="282.7" height="2.5" rx="1.25" class="f-purple"/><g transform="translate(788.7,238.89999999999998) scale(0.84)" fill="none" class="s-purple" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v12M18 9a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM6 21a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM18 9a9 9 0 0 1-9 9"/></g><text x="798.7" y="283.9" font-size="15" class="t" text-anchor="middle">Link</text><text x="798.7" y="307.1" font-size="12.5" class="x" text-anchor="middle">related_to links above 0.85 similarity,</text><text x="798.7" y="325.3" font-size="12.5" class="x" text-anchor="middle">plus supersedes and named links</text><path d="M480.0 356.9v18M475.0 369.9l5 5 5-5" class="ln" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="8.0" y="386.9" width="466.0" height="126.9" rx="8" class="card"/><rect x="20.0" y="386.9" width="442.0" height="2.5" rx="1.25" class="f-blue"/><g transform="translate(231.0,402.9) scale(0.84)" fill="none" class="s-blue" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6M1 20v-6h6M3.5 9a9 9 0 0 1 14.9-3.4L23 10M1 14l4.6 4.4A9 9 0 0 0 20.5 15"/></g><text x="241.0" y="448.9" font-size="16" class="t" text-anchor="middle">Topics</text><text x="241.0" y="473.1" font-size="13" class="x" text-anchor="middle">Louvain clusters of similar sections, named by a model; new</text><text x="241.0" y="491.9" font-size="13" class="x" text-anchor="middle">sections join existing topics</text><rect x="486.0" y="386.9" width="466.0" height="126.9" rx="8" class="card"/><rect x="498.0" y="386.9" width="442.0" height="2.5" rx="1.25" class="f-blue"/><g transform="translate(709.0,402.9) scale(0.84)" fill="none" class="s-blue" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/></g><text x="719.0" y="448.9" font-size="16" class="t" text-anchor="middle">Entities</text><text x="719.0" y="473.1" font-size="13" class="x" text-anchor="middle">Extracted names, aliases and relationships, matched by exact</text><text x="719.0" y="491.9" font-size="13" class="x" text-anchor="middle">name, embeddings and a judge model</text><path d="M480.0 523.8v18M475.0 536.8l5 5 5-5" class="ln" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="8" y="553.8" width="944" height="172.0" rx="12" class="group"/><text x="24" y="575.8" font-size="10.5" class="m f-green">READ BACK BY AGENTS</text><rect x="22.0" y="587.8" width="297.3" height="124.0" rx="8" class="card"/><rect x="34.0" y="587.8" width="273.3" height="2.5" rx="1.25" class="f-green"/><g transform="translate(160.7,603.8) scale(0.84)" fill="none" class="s-green" stroke-wi