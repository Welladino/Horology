# The same gates as Cloud Build (cloudbuild.yaml), on every push and pull request, plus a scan of the
# whole Git history for secrets. Nothing here deploys or uses a production credential: tests run
# against a throwaway Postgres service container. Scanners run as pinned Docker images and GitHub's own
# actions are pinned to commits, so no third-party action code runs with access to the repository.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TRIVY_IMAGE: aquasec/trivy:0.75.0          # keep in step with cloudbuild.yaml
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1

jobs:
  tests-and-dependency-audit:
    name: Tests, Bandit and pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_PASSWORD: ci-admin-only  # test-only value for this throwaway container
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"  # as Cloud Build's python:3.12-slim
      - name: Run scripts/ci/check.sh (migrations, all tests, skip check, Bandit, pip-audit)
        run: bash scripts/ci/check.sh
        env:
          CI_REPORTS: ${{ runner.temp }}/reports
          GATEWAY_TEST_DATABASE_URL: postgresql://postgres:ci-admin-only@127.0.0.1:5432/postgres
          GATEWAY_TEST_RUNTIME_URL: postgresql://horology_gateway:ci-runtime-only@127.0.0.1:5432/postgres
          GRAPH_TEST_RUNTIME_URL: postgresql://horology_graph:ci-graph-only@127.0.0.1:5432/postgres

  source-security:
    name: Source and Git history secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the whole history, for gitleaks
          persist-credentials: false
      - name: Trivy, secrets and misconfigurations in the source (HIGH/CRITICAL fail)
        run: >-
          docker run --rm -v "$PWD:/repo:ro" "$TRIVY_IMAGE" fs --scanners secret,misconfig
          --severity HIGH,CRITICAL --exit-code 1 --no-progress
          --ignorefile /repo/.trivyignore.yaml --skip-dirs /repo/.git /repo
      - name: gitleaks, secrets anywhere in the Git history (values redacted)
        run: >-
          docker run --rm -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*'
          -v "$PWD:/repo:ro" "$GITLEAKS_IMAGE" git /repo --redact --no-banner

  images:
    name: Images, vulnerabilities and licences
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: [mcp-gateway, document-graph]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: docker build --pull -f "mcp-servers/${{ matrix.image }}/Dockerfile" -t "ci/${{ matrix.image }}:${{ github.sha }}" .
      - name: Image contract (scripts/ci/check_image.py)
        run: docker run --rm -i --entrypoint python "ci/${{ matrix.image }}:${{ github.sha }}" - < scripts/ci/check_image.py
      - name: Export for Trivy
        run: docker save -o "${{ runner.temp }}/image.tar" "ci/${{ matrix.image }}:${{ github.sha }}"
      - name: Trivy, every HIGH/CRITICAL vulnerability (report only)
        run: >-
          docker run --rm -v "${{ runner.temp }}:/in:ro" "$TRIVY_IMAGE" image --scanners vuln
          --severity HIGH,CRITICAL --exit-code 0 --no-progress --input /in/image.tar
      - name: Trivy, fixable HIGH/CRITICAL vulnerabilities and secrets (fail)
        run: >-
          docker run --rm -v "${{ runner.temp }}:/in:ro" "$TRIVY_IMAGE" image --scanners vuln,secret
          --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 --no-progress --input /in/image.tar
      - name: Trivy, forbidden licences such as AGPL or SSPL (fail)
        run: >-
          docker run --rm -v "${{ runner.temp }}:/in:ro" "$TRIVY_IMAGE" image --scanners license
          --severity CRITICAL --exit-code 1 --no-progress --input /in/image.tar
