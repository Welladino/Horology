model:
  provider: openrouter
  default: deepseek/deepseek-v4-flash-0731
fallback_providers:
  - provider: openrouter
    model: z-ai/glm-5.3-flash
moa:
  default_preset: deepseek-glm
  privacy_filter: full
  presets:
    deepseek-glm:
      reference_models:
        - provider: openrouter
          model: z-ai/glm-5.3-flash
          reasoning_effort: low
      aggregator:
        provider: openrouter
        model: deepseek/deepseek-v4-flash-0731
        reasoning_effort: medium
      degraded_reference_policy: loud
      fanout: user_turn
      enabled: true
database:
  journal_mode: delete
stt:
  enabled: false
dashboard:
  theme: default
platform_toolsets:
  cli:
    - clarify
    - file
    - kanban
    - memory
    - session_search
    - skills
    - todo
mcp_servers:
  document-graph-https:
    url: https://document-graph-366292507424.us-central1.run.app/mcp
    auth: oauth
    enabled: true
    tools:
      include:
        - search_documents
        - get_document
        - get_related_documents
        - list_documents
        - list_topics
        - get_topic
        - find_entity
        - entity_documents
        - list_entities
        - list_runs
        - get_item_history
  mcp-gateway:
    url: http://horology-mcp-gateway:8767/mcp
    enabled: false
  Github MCP:
    url: https://api.githubcopilot.com/mcp/readonly
    enabled: false
  Composio Coordinator:
    url: https://backend.composio.dev/tool_router/trs_Mjm32avablC_/mcp
    headers:
      x-api-key: ${COMPOSIO_HOROLOGY}
    enabled: true
_config_version: 51
