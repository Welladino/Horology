# Horology Pipeline workflow: the single definition of states, values and allowed moves.
# Skills, the Apps Scripts and the digest's health checks follow this file.
# Changing a rule means changing it here first. Validated by tests/unit/workflow/.

version: 4

# Who may change things.
actors:
  founder: The founder, editing the sheet or answering in a session.
  capture: horology-capture-triage, recording new or updated items.
  planner: horology-planner, acting only on Agent status Plan rows.
  supervisor: horology-supervisor (dispatch and item modes) and the specialists it runs.
  synthesis: horology-synthesis-artifacts, invoked by the supervisor in the same Stage 3 run.
  sync: The pipeline-decisions Apps Script applying recorded decisions.

# Pipeline Master fields that drive the workflow, with their allowed values.
fields:
  Type:
    values: [Idea, Research, Direction, Plan, Feature, Enhancement, Refactor, Fix]
  Status:
    values: [Inbox, Parked, Researching, In progress, Awaiting decision, Approved, Rework, Completed, Rejected]
  Stage:
    values: [Stage 0, Stage 1, Stage 2, Stage 3, Stage 4]
  Review stage:
    values: [Investigation proposal, Specialist deliverable, Implementation question]
  Agent status:
    values: [No action, Plan, Ready]
    default: No action
  Agent type:
    values: [Claude Code, Codex, ChatGPT Work, Hermes, Manual, Unassigned]
    default: Unassigned
  Run location:
    values: [Local, Cloud]
    blank_means: Local
  Planner output:
    values: ["No", "Yes"]
    set_by: [planner]

# Type chooses the route an item's runs take. Both routes start with a Stage 1 specialist document in
# Drive plus Steps rows (founder, 04/11/2026). The investigation route reviews that Stage 1 proposal at
# Stage 2 before the Stage 3 deliverable and Stage 4 synthesis. The implementation route was decided by
# the founder: Stage 1 is the implementation plan, Stage 3 the implementation and its Implementation
# report, Stage 4 Completed with that report as the record (a page made from it only on the founder's request,
# 04/11/2026), with Status In progress until then and no Stage 2; a founder choice it needs is an Implementation question, which links the Stage 1 document.
routes:
  investigation: {types: [Idea, Research, Direction, Plan], stages: [Stage 1, Stage 2, Stage 3, Stage 4]}
  implementation: {types: [Feature, Enhancement, Refactor, Fix], stages: [Stage 1, Stage 3, Stage 4]}

statuses:
  Inbox: {meaning: Captured; not yet scoped or selected, stages: [Stage 0, Stage 1]}
  Parked: {meaning: Deliberately deferred, with a revisit trigger, stages: [Stage 0, Stage 1, Stage 2, Stage 3, Stage 4]}
  Researching: {meaning: An authorised investigation or deliverable is in progress (investigation route), stages: [Stage 1, Stage 3]}
  In progress: {meaning: An implementation-route run is planning (Stage 1) or implementing (Stage 3), stages: [Stage 1, Stage 3]}
  Awaiting decision: {meaning: Work is ready for the founder's review, stages: [Stage 2, Stage 3, Stage 4]}
  Approved: {meaning: The founder accepted a Stage 1 proposal; the Stage 3 deliverable is next, stages: [Stage 3]}
  Rework: {meaning: The founder asked for changes; instructions are on the decision, stages: [Stage 1, Stage 3]}
  Completed: {meaning: "Workflow complete: the Stage 4 synthesis, or on the implementation route the Implementation report, was saved (the founder can still reopen it from its decision); implementations finished before 04/11/2026 ended at Stage 3", stages: [Stage 3, Stage 4]}
  Rejected: {meaning: Not pursued; history kept, stages: [Stage 2, Stage 3, Stage 4]}

stages:
  Stage 0: Capture
  Stage 1: A specialist document in Drive (Research, Direction, Plan or Technical Assessment template) plus Steps rows; the investigation and proposal, or on the implementation route the implementation plan
  Stage 2: Founder decision (investigation route only)
  Stage 3: Specialist deliverable; on the implementation route, the implementation and its Implementation report Google Doc
  Stage 4: Visual synthesis of the Stage 3 deliverable (on the implementation route, the Implementation report, with a page made from it only on request); the item is Completed, and its Specialist deliverable decision can reopen it

# Allowed moves. "from"/"to" give the fields that change; unlisted fields stay as they are.
# "when" is the trigger. Moves not listed here are unexpected and the digest reports them.
transitions:
  - id: capture
    actor: capture
    from: {}
    to: {Status: Inbox, Stage: Stage 0, Agent status: No action, Agent type: Unassigned}
    when: A new idea, request or parked proposal is recorded.

  - id: park
    actor: founder
    from: {Status: [Inbox, Rework]}
    to: {Status: Parked, Agent status: No action}
    when: The founder defers the item and sets a revisit trigger.

  - id: unpark
    actor: founder
    from: {Status: Parked}
    to: {Status: Inbox}
    when: The revisit trigger is met.

  - id: request-plan
    actor: founder
    from: {Agent status: No action, Status: [Inbox, Rework, Approved]}
    to: {Agent status: Plan}
    when: The item needs scoping or splitting before it can run.

  - id: planned
    actor: planner
    from: {Agent status: Plan}
    to: {Agent status: No action, Planner output: "Yes"}
    when: The planner has written a sharper Next step or Steps. It never sets Ready.

  - id: select
    actor: founder
    from: {Agent status: [No action, Plan], Status: [Inbox, Rework, Approved, In progress], Agent type: [Claude Code, Codex, ChatGPT Work, Hermes]}
    to: {Agent status: Ready, Stage: [Stage 1, Stage 3]}
    when: >-
      The founder chooses Agent type and Run location and selects the item for a run. ChatGPT Work is Cloud
      only; Hermes is Local only. Manual and Unassigned items are never Ready. In progress applies to
      implementation-route items whose run failed or stopped.

  - id: start-run
    actor: supervisor
    from: {Agent status: Ready, Type: [Idea, Research, Direction, Plan]}
    to: {Status: Researching}
    when: A supervisor session claims an investigation-route item (claim_item) and starts work.

  - id: start-implementation
    actor: supervisor
    from: {Agent status: Ready, Type: [Feature, Enhancement, Refactor, Fix]}
    to: {Status: In progress}
    when: >-
      A supervisor session claims an implementation-route item and starts work: at Stage 1 it writes the
      implementation plan as Steps rows; at Stage 3 (resumed, rework or an older Approved item) it implements.

  - id: plan-implementation
    actor: supervisor
    from: {Status: In progress, Stage: Stage 1}
    to: {Stage: Stage 3}
    when: The implementation plan is on the Steps tab. The run moves the item to Stage 3 itself and implements in the same run.

  - id: complete-implementation
    actor: [supervisor, synthesis]
    from: {Status: In progress, Stage: Stage 3}
    to: {Status: Completed, Stage: Stage 4, Review stage: Specialist deliverable, Agent status: No action}
    when: >-
      Every Steps row is Done or Skipped, the work is committed and pushed, no founder decision is needed,
      and in the same run the Implementation report Google Doc is saved to the Document Index (decided by the
      founder on 04/11/2026). No page is made by default; the synthesis specialist makes one from the report
      only when the founder asks, with no Document Index row and no status change. As for synthesize-stage-3, the run
      proposes a Specialist deliverable decision and makes it the Current decision ID; the founder can
      accept it or reopen the item from it (see open_review).

  - id: raise-implementation-question
    actor: supervisor
    from: {Status: In progress, Stage: [Stage 1, Stage 3]}
    to: {Status: Awaiting decision, Stage: Stage 3, Review stage: Implementation question, Agent status: No action}
    when: >-
      The run needs a founder choice. It stops with a proposed decision and Options rows, as for any proposal;
      the work done so far stays committed and pushed, the Steps rows show what is left, and the decision's
      Research Links name the item's Stage 1 document in Drive.

  - id: submit-for-review
    actor: supervisor
    from: {Status: Researching, Stage: Stage 1}
    to: {Status: Awaiting decision, Stage: Stage 2, Review stage: Investigation proposal, Agent status: No action}
    when: The investigation is saved and its proposed decision is ready for the founder.

  - id: synthesize-stage-3
    actor: [supervisor, synthesis]
    from: {Status: Researching, Stage: Stage 3}
    to: {Status: Completed, Stage: Stage 4, Review stage: Specialist deliverable, Agent status: No action}
    when: >-
      In the same Stage 3 run, the specialist deliverable is saved to the Document Index and the visual
      synthesis to the Synthesis folder (a Stage 4 HTML page has no Document Index row; the Pages tab lists it).
      The run also proposes a Specialist deliverable decision (accept, rework, park) and makes it the Current
      decision ID. The item is Completed straight away (decided by the founder on 03/11/2026, Decision 15);
      the founder can accept that decision, or reopen the item from it with rework or park (see open_review).

  - id: run-failed
    actor: supervisor
    from: {Status: [Researching, In progress]}
    to: {Agent status: No action}
    when: The run failed or was released; Status stays Researching or In progress and the Runs row explains why. The founder decides whether to select it again.

  - id: accept-stage-1
    actor: [founder, sync]
    from: {Status: Awaiting decision, Review stage: Investigation proposal}
    to: {Status: Approved, Stage: Stage 3, Agent status: Ready}
    when: The decision is accepted. Manual items get No action instead of Ready.

  - id: accept-stage-3
    actor: [founder, sync]
    from: {Status: [Completed, Awaiting decision], Stage: Stage 4, Review stage: Specialist deliverable}
    to: {Status: Completed, Stage: Stage 4, Agent status: No action}
    when: >-
      The founder accepts the Stage 3 deliverable (or the implementation and its report) after seeing its
      Stage 4 synthesis or page. The item is already Completed, so nothing changes; Awaiting decision covers
      items that reached Stage 4 before 03/11/2026.

  - id: resume-implementation
    actor: [founder, sync]
    from: {Status: Awaiting decision, Review stage: Implementation question}
    to: {Status: In progress, Stage: Stage 3, Agent status: Ready}
    when: The founder answers the Implementation question; the item resumes at Stage 3 Ready for its platform. Manual items get No action instead of Ready.

  - id: rework
    actor: [founder, sync]
    from: {Status: [Awaiting decision, Completed]}
    to: {Status: Rework, Stage: [Stage 1, Stage 3], Agent status: Ready}
    when: >-
      The decision is marked rework with instructions. Stage returns to Stage 1 for Investigation proposal, or
      Stage 3 for Specialist deliverable and Implementation question. Manual items get No action. Completed
      applies only to an open Stage 4 review (open_review).

  - id: decide-park
    actor: [founder, sync]
    from: {Status: [Awaiting decision, Completed]}
    to: {Status: Parked, Stage: [Stage 2, Stage 3, Stage 4], Agent status: No action}
    when: The decision is parked. Completed applies only to an open Stage 4 review (open_review).

  - id: decide-reject
    actor: [founder, sync]
    from: {Status: [Awaiting decision, Completed]}
    to: {Status: Rejected, Stage: [Stage 2, Stage 3, Stage 4], Agent status: No action}
    when: The decision is rejected. Completed applies only to an open Stage 4 review (open_review).

  - id: reject
    actor: founder
    from: {Status: [Inbox, Parked]}
    to: {Status: Rejected}
    when: The founder drops an item without a review round.

  - id: reopen
    actor: founder
    from: {Status: Rejected}
    to: {Status: Inbox, Stage: Stage 0}
    when: The founder reopens rejected work.

  - id: revise
    actor: [founder, sync]
    from: {Status: [Approved, Rework, Parked, Rejected, Completed]}
    to: {Status: [Approved, Rework, Parked, Rejected, Completed, In progress], Stage: [Stage 1, Stage 2, Stage 3, Stage 4], Agent status: [Ready, No action]}
    when: >-
      The founder revises the item's current, already decided decision on the decision page (for example
      Approved to Parked). The item moves as the new outcome would have moved it from review; see revise below.

# Decision Register status values and the transition each one triggers.
decisions:
  proposed: {meaning: Drafted by an agent; waiting for the founder}
  accepted: {triggers: [accept-stage-1, accept-stage-3, resume-implementation]}
  rework: {triggers: [rework], requires: Rework instructions}
  parked: {triggers: [decide-park]}
  rejected: {triggers: [decide-reject]}

# Where an item's current proposed decision can be decided: Awaiting decision, or a Stage 4 item that
# synthesize-stage-3 or complete-implementation left Completed with a proposed Specialist deliverable decision. Deciding it there
# accepts the deliverable (no change) or reopens the item with rework, park or reject. A Completed item
# whose current decision is for another Review stage has no open review.
open_review:
  - {Status: Awaiting decision}
  - {Status: Completed, Stage: Stage 4, Review stage: Specialist deliverable}

# Revising a decided decision. The decision row keeps its Decision ID: Status becomes the new outcome,
# the founder's reason is appended to Reason (rework: Rework instructions) and Review source records it.
# A new review round still gets a new Decision row.
revise:
  transition: revise
  decision_statuses: [accepted, rework, parked, rejected]  # the recorded outcome being revised, and the new one
  item_statuses: [Approved, Rework, Parked, Rejected, Completed]  # never Inbox, Researching, In progress or Awaiting decision
  requires: The decision is the item's Current decision ID, and a reason
  effect: The Pipeline fields the new outcome's decision transition sets for the decision's Review stage

# Runs: one record per claim, in the execution history (run_log in Neon).
# Agents call claim_item at the start and finish_run at the end; register rows use register_ids below.
runs:
  statuses: [claimed, running, done, failed, released]
  claim_hours: 2
  transitions:
    - {from: claimed, to: done, when: "finish_run: outputs saved and checked"}
    - {from: claimed, to: failed, when: "finish_run: the run could not finish; notes say why"}
    - {from: claimed, to: released, when: "finish_run: the run was not started"}
  expired: A claimed or running run whose claim has expired belongs to a dead run; the item may be claimed again.

# Permanent register IDs. Parallel runs write the same registers, so IDs are never taken from the sheet.
register_ids:
  pipeline: {allocated_by: Add Pipeline item form, lock: Apps Script script lock}
  decision: {allocated_by: reserve_id, register: Decision Register Master, column: Decision ID}
  document: {allocated_by: reserve_id, register: Document Index, column: Document ID}
  reserve: >-
    reserve_id(register, pipeline_id, run_id) returns max(last reserved, highest synced or live sheet ID) + 1
    in one statement. A Pipeline item's reservation needs the live run that holds it and is recorded
    against that run.
  before_write: >-
    check_register_write before every Decision Register or Document Index write. If the ID already
    belongs to another Pipeline ID or Drive file, the write stops and is reported; nothing is overwritten.
  find_rows_by: ID  # never by row position, title or a row number read earlier

# Child tabs: one row per entry, joined to the parent row by its permanent ID, never by row position.
# Steps: the planner, or a Stage 1 run on either route that finds no open rows, writes one row per planned
# step; Next step / Research question stays a one-line question. Older items may still hold a numbered list in Next step, which is read the same way.
# The run reports the completed numbers in finish_run's steps_done and marks those rows Done.
# Options: whoever drafts a proposed decision writes one row per option; the Master Decision cell
# keeps a one-line summary. Decisions without Options rows fall back to the option codes in their text.
tabs:
  Steps:
    workbook: Pipeline
    key: [Pipeline ID, Step]
    columns: [Pipeline ID, Step, Task, Specialist, Status]
    Status: [Planned, Done, Skipped]
    written_by: [planner, supervisor]
  Options:
    workbook: Decision Register
    key: [Decision ID, Code]
    columns: [Decision ID, Code, Summary, Recommended, Key figures]
    Recommended: ["Yes", ""]
    written_by: [supervisor]

# Founder-only rules every actor follows.
rules:
  - Only the founder makes an item Ready, directly or through a decision (accept or rework), and only the founder chooses Agent type and Run location and decides.
  - Agents never record a decision as accepted, parked or rejected.
  - Each platform runs only rows whose Agent type is that platform. Manual rows are never run by agents.
  - ChatGPT Work rows use Run location Cloud and are claimed by the Codex supervisor harness. Hermes rows use Run location Local and are claimed by Operator as Hermes; Coordinator only dispatches them through Kanban.
  - Ready selects the stated next step only. Only an implementation-route Type (Feature, Enhancement, Refactor, Fix) authorises implementation; investigation-route items never do.
  - Graph Inclusion on the Document Index is the founder's. Agents add new rows with it FALSE and never set it TRUE or change a value already there.
