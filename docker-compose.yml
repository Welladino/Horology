services:
  document-graph-mcp:
    build: ./mcp-servers/document-graph
    container_name: horology-document-graph-mcp
    restart: unless-stopped
    # No `ports:` here deliberately - not published to the host at all.
    # Reachable only from other containers on this compose network, by
    # service name (http://document-graph-mcp:8765/mcp), which is how the
    # hermes service connects to it. Avoids mounting the Docker socket into
    # Hermes's container just to reach this one via `docker exec`.
    environment:
      - DATABASE_URL_POOLED=${DATABASE_URL_POOLED:?set DATABASE_URL_POOLED in .env}

  github-monitor-mcp:
    build: ./mcp-servers/github-monitor
    container_name: horology-github-monitor-mcp
    restart: unless-stopped
    # No `ports:` here deliberately - same isolation pattern as
    # document-graph-mcp. Reachable only from other containers on this
    # compose network (http://github-monitor-mcp:8766/mcp).
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN:?set GITHUB_TOKEN in .env}
      - GITHUB_REPO=${GITHUB_REPO:-Welladino/Article_aggregator_agent}

  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: horology-hermes
    restart: unless-stopped
    command: gateway run
    ports:
      - "127.0.0.1:8642:8642"   # OpenAI-compatible API + health endpoint (localhost only — no auth on this port)
      - "127.0.0.1:9119:9119"   # Web dashboard (localhost only)
    volumes:
      - ./hermes-data:/opt/data
    environment:
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_HOST=0.0.0.0
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${DASHBOARD_USERNAME:-admin}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${DASHBOARD_PASSWORD:?set DASHBOARD_PASSWORD in .env}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
