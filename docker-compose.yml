services:
  document-graph-mcp:
    build: ./mcp-servers/document-graph
    container_name: horology-document-graph-mcp
    restart: unless-stopped
    # Idles - the actual MCP server (server.py) is invoked per-connection via
    # `docker exec -i horology-document-graph-mcp python server.py`, not as a
    # standalone daemon. This keeps a built, ready container available for
    # that exec without exposing a network port.
    entrypoint: ["sleep", "infinity"]
    environment:
      - DATABASE_URL_POOLED=${DATABASE_URL_POOLED:?set DATABASE_URL_POOLED in .env}

  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: horology-hermes
    restart: unless-stopped
    command: gateway run
    ports:
      - "127.0.0.1:8642:8642"   # OpenAI-compatible API + health endpoint (localhost only — no auth on this port)
      - "127.0.0.1:9119:9119"   # Web dashboard (localhost only)
    volumes:
      - ./hermes-data:/opt/data
    environment:
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_HOST=0.0.0.0
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${DASHBOARD_USERNAME:-admin}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${DASHBOARD_PASSWORD:?set DASHBOARD_PASSWORD in .env}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
