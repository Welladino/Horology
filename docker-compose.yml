name: horology-hermes

services:
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: horology-hermes
    restart: unless-stopped
    command: gateway run
    ports:
      - "127.0.0.1:8642:8642"   # OpenAI-compatible API + health endpoint (localhost only — no auth on this port)
      - "127.0.0.1:9119:9119"   # Web dashboard (localhost only)
    volumes:
      - ./hermes-data:/opt/data
    environment:
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_HOST=0.0.0.0
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${DASHBOARD_USERNAME:-admin}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${DASHBOARD_PASSWORD:?set DASHBOARD_PASSWORD in .env}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # Read-only Neon credential for the daily document-graph backfill sweep
      # (scripts/check_unembedded_documents.py). Cron scripts don't inherit
      # Hermes-managed secrets by design, but this is a plain container env
      # var, not a Hermes-managed one - verified hands-on that it survives
      # into the cron script's subprocess environment, see
      # docs/planning/research/2026-08-07_cron-script-security-pattern_research.md.
      - CRON_SWEEP_RO_DATABASE_URL=${CRON_SWEEP_RO_DATABASE_URL:?set CRON_SWEEP_RO_DATABASE_URL in .env}

# Shared network is managed independently of the Hermes project.
networks:
  default:
    external: true
    name: horology_default
