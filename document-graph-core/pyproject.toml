[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "horology-document-graph-core"
version = "0.1.0"
description = "Document graph logic shared by the document-graph MCP service and its sync job."
requires-python = ">=3.12"
# Pinned versions live in mcp-servers/document-graph/requirements.txt.
dependencies = []

[tool.setuptools.packages.find]
include = ["graph_core*"]
