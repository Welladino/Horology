<html lang="en">
<head>

  <?!= include('SharedUi') ?>
  <style>
    /* Triage board (item 52): dark top bar, white panels on a light ground, one accent. */
    :root { color-scheme:light; --ink:var(--h-ink); --muted:var(--h-muted); --line:var(--h-line);
      --accent:var(--h-accent); --pale:var(--h-pale); --ground:var(--h-ground); --amber:var(--h-amber);
      --bar:#1e2a32; --bar-raised:#2c3a44; --white:#fff; --sticky:68px; }
    * { box-sizing:border-box; }
    html,body { background:var(--ground); }
    body { margin:0; min-height:100vh; color:var(--ink);
      font:15px/1.5 'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif; }
    button,select,textarea,input { font:inherit; }
    button { cursor:pointer; }
    a { color:var(--accent); }
    button:focus-visible,a:focus-visible,summary:focus-visible,[tabindex]:focus-visible {
      outline:3px solid #7fb6c4; outline-offset:2px; }
    .sr-only { position:absolute; width:1px; height:1px; margin:-1px; overflow:hidden;
      clip:rect(0 0 0 0); white-space:nowrap; border:0; padding:0; }

    /* Top bar */
    .top { position:sticky; top:0; z-index:5; background:var(--bar); color:#fff; }
    .top-inner { max-width:1440px; margin:auto; padding:8px 20px; display:flex; align-items:center;
      gap:8px 16px; flex-wrap:wrap; }
    .brand { display:flex; align-items:center; gap:10px; margin-right:6px; }
    .mark { width:32px; height:32px; border-radius:8px; background:var(--accent); color:#fff;
      display:grid; place-items:center; font-weight:700; }
    .brand h1 { margin:0; font-size:16px; font-weight:600; letter-spacing:-.01em; }
    .nav { display:flex; gap:2px; }
    .nav button { display:inline-flex; align-items:center; gap:8px; min-height:44px; padding:0 14px;
      border:0; border-radius:8px; background:transparent; color:#c9d3d9; font-weight:600; }
    .nav button:hover { background:var(--bar-raised); color:#fff; }
    .nav button.active { background:#33434d; color:#fff; box-shadow:inset 0 -3px 0 var(--amber); }
    .nav-count { min-width:22px; padding:1px 7px; border-radius:99px; background:var(--amber);
      color:var(--bar); font-size:12px; font-weight:700; text-align:center; }
    .top-search { flex:1 1 220px; max-width:460px; margin:0 0 0 auto; }
    .top-search input { width:100%; min-height:44px; padding:9px 12px; border-radius:8px;
      border:1px solid #4a5b66; background:var(--bar-raised); color:#fff; }
    .top-search input::placeholder { color:#b4c1c8; }
    .top-search input:focus { outline:2px solid #7fb6c4; outline-offset:1px; border-color:#7fb6c4; }
    .add-button { min-height:44px; padding:0 16px; border:0; border-radius:8px; background:var(--amber);
      color:var(--bar); font-weight:700; white-space:nowrap; }
    .add-button:hover { background:#f5c260; }
    .add-button.active { box-shadow:0 0 0 2px var(--bar),0 0 0 4px var(--amber); }
    .sheet-link { color:#c9d3d9; font-size:13px; text-decoration:none; padding:12px 4px; white-space:nowrap; }
    .sheet-link:hover { color:#fff; text-decoration:underline; }

    /* Page frame */
    .wrap { max-width:1440px; margin:auto; padding:20px 20px 64px; }
    .hero { display:flex; justify-content:space-between; align-items:flex-end; gap:16px;
      flex-wrap:wrap; margin-bottom:16px; }
    .eyebrow { color:var(--accent); text-transform:uppercase; letter-spacing:.1em; font-size:11px;
      font-weight:700; }
    .hero h2 { margin:2px 0 2px; font-size:24px; line-height:1.25; font-weight:600; letter-spacing:-.015em; }
    .lead { color:var(--muted); margin:0; max-width:680px; font-size:14px; }
    .hero-tools,.toolbar-actions { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .panel { background:#fff; border:1px solid var(--line); border-radius:10px; }
    .panel-head { padding:20px 24px 16px; border-bottom:1px solid var(--line); }
    .panel-head h2 { margin:8px 0 10px; font-size:24px; line-height:1.25; font-weight:600; max-width:920px; }
    .panel-body { padding:20px 24px 24px; display:grid; gap:24px; }
    .head-line { display:flex; flex-wrap:wrap; align-items:center; gap:4px 8px; color:var(--muted); font-size:13px; }
    .head-line .id { color:var(--accent); font-weight:700; }

    .meta { display:flex; flex-wrap:wrap; gap:6px; }
    .section h3 { margin:0 0 8px; font-size:12px; font-weight:700; letter-spacing:.08em;
      text-transform:uppercase; color:var(--muted); }
    .section p.hint { color:var(--muted); font-size:13px; margin:-2px 0 10px; }
    .plain-copy { margin:0; white-space:pre-wrap; overflow-wrap:anywhere; line-height:1.6; }
    .plain-copy + .plain-copy { margin-top:14px; }
    .bullets { margin:0; padding-left:20px; line-height:1.6; }

    .load-error { display:flex; align-items:center; gap:12px; flex-wrap:wrap; color:#a3302a; }
    .message { font-size:13px; color:var(--muted); }

    .back { display:inline-flex; align-items:center; gap:6px; }
    .detail-toolbar { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap;
      gap:10px; margin-bottom:14px; }
    .links { display:flex; flex-wrap:wrap; gap:8px; }
    .links a,.link-button { display:inline-flex; align-items:center; min-height:44px; padding:8px 12px;
      border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--accent);
      font-size:14px; font-weight:600; text-decoration:none; }
    .links a:hover,.link-button:hover { border-color:var(--accent); }
    .more-row { display:flex; justify-content:center; margin:12px 0 4px; }

    /* Status pills */
    .h-pill.tone-neutral { background:#e8edf0; color:#33434d; }
    .h-pill.tone-review { background:#fdeac2; color:#6b4700; }
    .h-pill.tone-success { background:#dcf1e5; color:#155d3b; }
    .h-pill.tone-warning { background:#fde6d3; color:#82420c; }
    .h-pill.tone-danger { background:#fbe0dd; color:#8b2924; }
    .h-pill.tone-stage { background:#ebe6f7; color:#4f3a83; }
    .h-pill.tone-info { background:#dcecf0; color:#0b4a5a; }

    /* Decisions: inbox beside a reading pane */
    .inbox-layout { display:grid; grid-template-columns:minmax(340px,400px) minmax(0,1fr); gap:16px;

    .inbox-head { padding:12px 14px 0; border-bottom:1px solid var(--line); }

    .inbox-title h2 { margin:0; font-size:18px; font-weight:600; }
    .tabs { display:flex; gap:2px; margin-top:6px; }
    .tabs button { min-height:44px; padding:0 12px; border:0; border-bottom:3px solid transparent;
      background:transparent; color:var(--muted); font-weight:600; }
    .tabs button[aria-pressed="true"] { color:var(--ink); border-bottom-color:var(--accent); }
    .tab-count { margin-left:6px; padding:0 7px; border-radius:99px; background:#e8edf0; color:#33434d;

    .inbox-list { flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain; }
    .inbox-row { position:relative; display:block; width:100%; min-height:44px; padding:12px 14px 12px 18px;
      border:0; border-bottom:1px solid var(--line); background:#fff; color:var(--ink); text-align:left; }
    .inbox-row:hover { background:#f4f7f8; }
    .inbox-row[aria-current="true"] { background:var(--pale); }
    .inbox-row[aria-current="true"]::before { content:''; position:absolute; left:0; top:0; bottom:0;
      width:4px; background:var(--accent); }
    .row-meta { display:flex; align-items:center; gap:6px; color:var(--muted); font-size:12px; min-width:0; }
    .row-meta .id { color:var(--accent); font-weight:700; }
    .row-meta .age { margin-left:auto; white-space:nowrap; }
    .row-title { display:block; margin:3px 0 2px; font-weight:600; line-height:1.35; }
    .row-question { display:block; overflow:hidden; white-space:nowrap; text-overflow:ellipsis;
      color:var(--muted); font-size:13px; }
    .inbox .empty { margin:14px; }
    .reader { min-width:0; }
    .reader-panel { background:#fff; border:1px solid var(--line); border-radius:10px; }
    .reader-panel .panel-head h2 { margin-bottom:0; }
    .reader-empty { padding:40px 24px; text-align:center; color:var(--muted); }
    .reader-empty h2 { margin:0 0 6px; color:var(--ink); font-size:20px; font-weight:600; }
    .reader-grid { display:grid; grid-template-columns:minmax(0,1fr) minmax(280px,340px); gap:20px;
      padding:20px 24px 24px; align-items:start; }
    .reader-main { display:grid; gap:24px; min-width:0; }
    .decide-panel { position:sticky; top:calc(var(--sticky) + 12px); display:grid; gap:16px; padding:16px;
      background:#f6f8f9; border:1px solid var(--line); border-radius:10px; min-width:0; }
    .decide-panel > h3 { margin:0; font-size:16px; font-weight:600; }

    .decide-panel .actions .h-button { width:100%; }

    /* Options as cards; the recommended one carries the accent */
    .choices { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:10px; }
    .choices.compact { grid-template-columns:1fr; }
    .choice { position:relative; display:block; min-width:0; padding:14px; background:#fff;
      border:1px solid var(--line); border-radius:8px; }
    label.choice { cursor:pointer; padding-right:44px; }
    .choice.recommended { border:2px solid var(--accent); padding:13px; }
    label.choice.recommended { padding-right:43px; }
    label.choice:hover { border-color:var(--accent); }
    label.choice:has(input:checked) { background:var(--pale); box-shadow:inset 0 0 0 1px var(--accent);
      border-color:var(--accent); }
    label.choice:has(input:disabled) { cursor:default; }
    .choice input[type="radio"] { position:absolute; right:12px; top:12px; width:22px; height:22px; margin:0;

    .rec-label { display:block; margin-bottom:4px; color:var(--accent); font-size:11px; font-weight:700;

    .choice strong { display:block; }
    .choice span { display:block; margin-top:4px; color:#3a4952; font-size:14px; }
    .choice ul { margin:8px 0 0; padding-left:18px; font-size:13px; }

    /* Forms */
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px 20px; }
    .wide { grid-column:1/-1; }
    .field label,.filter-field label { display:block; margin-bottom:6px; font-size:13px; font-weight:600; }
    .field small { display:block; margin:-2px 0 6px; color:var(--muted); font-size:12px; }
    .field small:empty { display:none; }
    textarea { min-height:88px; resize:vertical; }
    .actions { display:flex; align-items:center; flex-wrap:wrap; gap:12px; }
    .more { border:1px solid var(--line); border-radius:8px; padding:0 16px; }
    .more summary,.filter-panel summary { display:flex; align-items:center; min-height:44px; cursor:pointer;
      font-weight:600; color:var(--accent); }
    .more[open] { padding-bottom:16px; }
    .panel-body > form { display:grid; gap:24px; }

    /* Pipeline board */
    .board-tools { display:flex; flex-wrap:wrap; align-items:end; gap:10px 12px; margin-bottom:10px; }
    .filter-field { flex:1 1 170px; max-width:240px; min-width:0; }
    .filter-panel { margin:0 0 12px; padding:0 14px; background:#fff; border:1px solid var(--line); border-radius:8px; }
    .filter-panel[open] { padding-bottom:14px; }
    .filter-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; }
    .board-count { margin:0 0 10px; color:var(--muted); font-size:13px; }
    .board { display:grid; grid-auto-flow:column; grid-auto-columns:minmax(260px,1fr); gap:12px;
      align-items:start; overflow-x:auto; padding-bottom:10px; scroll-snap-type:x proximity; }
    .column { scroll-snap-align:start; min-width:0; padding:10px; background:#e2e8eb;
      border:1px solid var(--line); border-radius:10px; }
    .column--waiting { border-top:4px solid var(--amber); }
    .column-head { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:2px 4px 10px; }
    .column-head h3 { margin:0; font-size:14px; font-weight:600; }
    .column-head .h-pill { background:#fff; }
    .column-list { display:grid; gap:8px; }
    .column-empty { margin:0; padding:12px; color:var(--muted); font-size:13px; text-align:center; }
    .column .more-row .h-button { width:100%; }
    .card-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:10px; }
    .card { display:block; width:100%; min-height:44px; padding:12px; background:#fff; color:var(--ink);
      border:1px solid var(--line); border-radius:8px; text-align:left; }
    .card:hover { border-color:var(--accent); box-shadow:0 2px 8px #1e2a3214; }
    .card-meta { display:flex; justify-content:space-between; align-items:center; gap:8px;
      color:var(--muted); font-size:12px; }
    .card-meta .id { color:var(--ink); font-weight:700; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
    .card-title { display:block; margin:6px 0; font-weight:600; line-height:1.35; }
    .card-foot { display:block; color:var(--muted); font-size:12px; }
    .card-foot .ready { color:#0b4a5a; font-weight:700; }
    .type-tag { flex:none; padding:2px 8px; border-radius:99px; font-size:11px; font-weight:700; }
    .type-tag.build { background:#dcecf0; color:#0b4a5a; }
    .type-tag.investigate { background:#efe7fa; color:#563887; }
    .board-note { margin:6px 0 0; color:var(--muted); font-size:13px; }

    /* Folders */
    .folder-controls { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin:0 0 14px; }
    .folder-path { display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin:0 0 12px; color:var(--muted); }
    .folder-crumb { min-height:44px; padding:0 4px; border:0; background:transparent; color:var(--accent); font-weight:600; }

    .folder-crumb[aria-current="page"] { color:var(--ink); }
    .folder-browser { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); align-items:stretch; gap:12px; }
    .folder-column,.folder-detail,.folder-results { min-width:0; padding:16px; background:#fff;
      border:1px solid var(--line); border-radius:10px; }
    .folder-column { display:flex; flex-direction:column; height:420px; overflow:hidden; }
    .folder-column-scroll { flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain;
      scrollbar-gutter:stable; padding-right:4px; }
    .folder-column h3,.folder-results h3 { flex:none; margin:0 0 10px; color:var(--muted); font-size:11px;
      letter-spacing:.1em; text-transform:uppercase; }
    .folder-group-label { margin:14px 0 6px; color:#82420c; font-size:11px; font-weight:700;
      letter-spacing:.08em; text-transform:uppercase; }
    .folder-row { display:flex; align-items:center; gap:8px; width:100%; min-height:44px; padding:10px;
      border:0; border-radius:8px; background:transparent; color:var(--ink); text-align:left; }
    .folder-row:hover { background:#f1f4f6; }
    .folder-row.selected { background:var(--pale); font-weight:600; box-shadow:inset 3px 0 0 var(--accent); }
    .folder-row-name { flex:1; min-width:0; overflow-wrap:anywhere; }
    .folder-row-arrow { color:var(--muted); font-size:20px; line-height:1; }
    .folder-column .empty { border:0; padding:10px; }
    .folder-detail,.folder-results { grid-column:1/-1; }
    .folder-detail-head { display:flex; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; gap:14px; }
    .folder-detail h3 { margin:4px 0 0; font-size:22px; font-weight:600; line-height:1.25; overflow-wrap:anywhere; }
    .folder-detail a.h-button { display:inline-flex; align-items:center; text-decoration:none; }
    .folder-chips { display:flex; flex-wrap:wrap; gap:6px; margin:16px 0 18px; }
    .folder-info { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px;
      border-top:1px solid var(--line); padding-top:16px; }
    .folder-info small { color:var(--muted); }
    .folder-info p { margin:4px 0 0; overflow-wrap:anywhere; }
    .folder-results .folder-row { border-top:1px solid var(--line); border-radius:0; }
    .folder-result-path { display:block; color:var(--muted); font-size:12px; }
    .folder-error { color:#a3302a; }
    .folder-report { margin-top:20px; padding:20px; background:#fff; border:1px solid var(--line); border-radius:10px; }
    .folder-report h3 { margin:0 0 14px; font-size:18px; font-weight:600; }
    .folder-report h4 { margin:14px 0 6px; font-size:15px; }
    .folder-report p { color:var(--muted); }
    .folder-report ul { margin:0; padding-left:22px; }
    .folder-report li { margin:5px 0; overflow-wrap:anywhere; }
    .folder-report li a { margin-left:7px; font-weight:600; }

    @media(max-width:1180px) {
      .reader-grid { grid-template-columns:1fr; }
      .decide-panel { position:static; }
    }
    @media(max-width:860px) {
      :root { --sticky:0px; }
      .top { position:static; }
      .top-inner { padding:8px 12px; }
      .nav { order:3; flex:1 1 100%; }
      .nav button { flex:1 1 0; justify-content:center; padding:0 6px; }
      .top-search { order:4; flex:1 1 auto; max-width:none; margin:0; }
      .add-button { order:5; }
      .sheet-link { display:none; }
      .wrap { padding:14px 16px 56px; }
      .inbox-layout { grid-template-columns:1fr; }
      .inbox { position:static; max-height:55vh; }
      .reader-grid,.panel-head,.panel-body { padding-left:16px; padding-right:16px; }
      .grid { grid-template-columns:1fr; }
      .wide { grid-column:auto; }
      .board { grid-auto-columns:minmax(250px,84vw); }
      .filter-field { max-width:none; }
    }
    @media(max-width:570px) {
      .brand h1 { display:none; }
      .folder-browser,.folder-info { grid-template-columns:1fr; }
      .folder-column { height:320px; }
    }
  </style>
</head>
<body>
  <header class="top"><div class="top-inner">
    <div class="brand"><div class="mark" aria-hidden="true">H</div><h1>Horology</h1></div>
    <nav class="nav" aria-label="Workspace">
      <button id="nav-decisions" class="active" type="button">Decisions<span class="nav-count" id="nav-decisions-count" aria-hidden="true" hidden></span></button>
      <button id="nav-pipeline" type="button">Pipeline</button>
      <button id="nav-folders" type="button">Folders</button>
    </nav>
    <form class="top-search" id="top-search-form" role="search">
      <label class="sr-only" for="top-search" id="top-search-label">Search decisions</label>
      <input id="top-search" type="search" autocomplete="off" placeholder="Search decisions">
    </form>
    <button id="nav-add" class="add-button" type="button">Add item</button>
    <a class="sheet-link" href="https://docs.google.com/spreadsheets/d/1aL678ACs97YpLIGrGU5LbpXHc7jQBxl64ED-sLyehvI/edit" target="_blank" rel="noopener noreferrer">Pipeline sheet ↗</a>
  </div></header>
  <main id="app" class="wrap"><div class="loading">Loading workspace…</div></main>
  <script type="application/json" id="initial-data"><?!= initialJson ?></script>
  <script>
    const $ = id => document.getElementById(id);
    const app = $('app'), topSearch = $('top-search');
    let page = 'decisions', inboxTab = 'pending', inboxScroll = 0, boardShow = 'board',
      dashboard = null, pipelineRows = null, pipelineQuery = '', pipelineSort = 'sheet',
      pipelineLimit = 50, historyLimit = 50, decisionQuery = '', columnLimits = {},
      fullText = {query:'',ids:null,pending:false},
      pipelineFilters = {'Domain':'','Type':'','Status':'','Entity':'',
        'Agent status':'','Agent type':'','Run location':'','Stage':''},
      filtersExpanded = false, folderData = null, folderPath = [], folderQuery = '',
      folderScroll = {roots:0,children:0},
      selectedId = '', selectedPipelineId = '', formData = null, notice = '',
      inboxUpdate = null, pipelineUpdate = null;
    function chipTone(value) {
      const label = String(value || '').trim().toLowerCase();
      if (/(?:^|:\s)(needs review|awaiting decision|proposed)$/.test(label)) return 'tone-review';
      if (/(?:^|:\s)(accepted|approved|ready|completed)$/.test(label)) return 'tone-success';
      if (/(?:^|:\s)(rework|parked|plan)$/.test(label)) return 'tone-warning';

      const bar = node('div','actions'), save = node('button','h-button h-button--primary','Add item');
      save.type = 'submit'; const message = node('span','message'); message.setAttribute('role','status');
      append(bar,save,message); form.appendChild(bar);
      form.onsubmit = event => {
        event.preventDefault(); save.disabled = true;
        message.className = 'message'; message.textContent = 'Adding…';
        const payload = {'Title':title.control.value,'Domain':domain.control.value,
          'Entity':entity.control.value,'Type':type.control.value,
          'Summary / Why':summary.control.value,
          'Next step / Research question':question.control.value,
          'Revisit trigger':trigger.control.value,
          'Agent status':agentStatus.control.value,'Agent type':agentType.control.value,
          'Run location':runLocation.control.value,'Link type':linkType.control.value,
          'URL':url.control.value,'GitHub branch':branch.control.value};
        google.script.run.withSuccessHandler(result => {
          afterWrite();
          form.reset(); agentStatus.control.value = 'No action'; agentType.control.value = 'Unassigned';
          updateEntities(); updateReady();
          message.className = 'message ok';
          message.textContent = 'Added Pipeline item ' + result.id + ' · ' + result.title +
            ' (' + result.stage + '). You can add another.';
          save.disabled = false; title.control.focus();
        }).withFailureHandler(error => {
          message.className = 'message error';
          message.textContent = error && error.message ? error.message : String(error);
          save.disabled = false;
        }).addPipelineItemFromWeb(payload);
      };
    }
    function folderChip(value,tone) {
      const chip = node('span','',value);
      chip.className = 'h-pill ' + tone;
      return chip;
    }
    function folderTypeTone(type) {
      if (type === 'Agent output') return 'tone-success';
      if (type === 'Agent reference') return 'tone-info';
      if (type === 'Hub' || type === 'Node') return 'tone-stage';
      return 'tone-neutral';
    }
    function folderRoots() {
      return [...(folderData.tree.roots || []),...(folderData.tree.unplaced || [])];
    }
    function defaultFolderPath() {
      const root = folderRoots()[0];
      return root ? [root,...(root.children || []).slice(0,1)] : [];
    }
    // Choosing a folder clears the top bar's folder search.
    function clearFolderSearch() { folderQuery = ''; if (page === 'folders') topSearch.value = ''; }
    function renderFolderBrowser() {
      const browser = $('folder-browser');
      browser.replaceChildren();
      const pathBar = $('folder-path');
      pathBar.replaceChildren();
      const crumb = (label,path,current) => {
        const button = node('button','folder-crumb',label);
        button.type = 'button';
        if (current) button.setAttribute('aria-current','page');
        button.onclick = () => { folderPath = path; clearFolderSearch(); renderFolderBrowser(); };
        return button;
      };
      pathBar.appendChild(crumb('All folders',[],!folderPath.length));
      folderPath.forEach((item,index) => {
        append(pathBar,node('span','','›'),
          crumb(item.name || 'Unnamed folder',folderPath.slice(0,index + 1),
            index === folderPath.length - 1));
      });
      const roots = folderRoots();
      if (folderQuery) {
        const results = node('section','folder-results');
        results.appendChild(node('h3','','Search results'));
        let count = 0;
        function visit(item,path) {
          const next = [...path,item];
          const text = [item.name,item.purpose,item.type,item.domain,item.entity,item.kind]
            .join(' ').toLowerCase();
          if (text.includes(folderQuery)) {
            count++;
            const button = node('button','folder-row'); button.type = 'button';
            const copy = node('span','folder-row-name');
            append(copy,node('strong','',item.name || 'Unnamed folder'),
              node('span','folder-result-path',next.map(part => part.name).join(' › ')));
            append(button,copy,node('span','folder-row-arrow','›'));
            button.onclick = () => { folderPath = next; clearFolderSearch(); renderFolderBrowser(); };
            results.appendChild(button);
          }
          (item.children || []).forEach(child => visit(child,next));
        }
        roots.forEach(root => visit(root,[]));
        if (!count) results.appendChild(node('p','empty','No matching folders.'));
        browser.appendChild(results); return;
      }
      const column = (title,key) => {
        const panel = node('section','folder-column');
        const list = node('div','folder-column-scroll');
        list.setAttribute('role','region');
        list.setAttribute('aria-label',title);
        append(panel,node('h3','',title),list);
        browser.appendChild(panel);
        list.onscroll = () => { folderScroll[key] = list.scrollTop; };
        return list;
      };
      function folderRow(item,selected,onClick) {
        const button = node('button','folder-row' + (selected ? ' selected' : ''));
        button.type = 'button';
        if (selected) button.setAttribute('aria-current','true');
        append(button,node('span','folder-row-name',item.name || 'Unnamed folder'),
          node('span','folder-row-arrow',(item.children || []).length ? '›' : ''));
        button.onclick = onClick;
        return button;
      }
      const domains = column('Domains and roots','roots');
      (folderData.tree.roots || []).forEach(root => domains.appendChild(
        folderRow(root,folderPath[0] === root,() => {
          folderPath = [root]; folderScroll.children = 0;
          renderFolderBrowser(); })));
      if ((folderData.tree.unplaced || []).length) {
        domains.appendChild(node('p','folder-group-label','Parent not found'));
        folderData.tree.unplaced.forEach(root => domains.appendChild(
          folderRow(root,folderPath[0] === root,() => {
            folderPath = [root]; folderScroll.children = 0;
            renderFolderBrowser(); })));
      }
      if (!roots.length) domains.appendChild(node('p','empty','No folders are listed in Locations.'));
      const selected = folderPath[folderPath.length - 1];
      const parent = folderPath[folderPath.length - 2];
      const listingParent = selected && (selected.children || []).length ? selected : parent;
      const children = column(listingParent ? 'Inside ' + (listingParent.name || 'folder') :
        'Choose a folder','children');
      if (listingParent) {
        listingParent.children.forEach(child => children.appendChild(
          folderRow(child,selected === child,() => {
            if ((child.children || []).length) folderScroll.children = 0;
            folderPath = listingParent === selected ? [...folderPath,child] :
              [...folderPath.slice(0,-1),child];
            renderFolderBrowser(); })));
      }
      if (!listingParent || !listingParent.children.length)
        children.appendChild(node('p','empty',selected ? 'No subfolders recorded.' :
          'Select a root folder to browse its contents.'));
      domains.scrollTop = folderScroll.roots;
      children.scrollTop = folderScroll.children;
      const detail = node('section','folder-detail'); browser.appendChild(detail);
      if (!selected) {
        detail.appendChild(node('p','empty','Select a folder to see its details.'));
        return;
      }
      const head = node('div','folder-detail-head');
      const title = node('div');
      append(title,node('span','eyebrow','Selected folder'),
        node('h3','',selected.name || 'Unnamed folder'));
      head.appendChild(title);
      const href = safeLink(selected.url);
      if (href) {
        const link = node('a','h-button h-button--primary','Open in Drive ↗');
        link.href = href; link.target = '_blank'; link.rel = 'noopener noreferrer';
        head.appendChild(link);
      }
      detail.appendChild(head);
      const chips = node('div','folder-chips');
      if (selected.type) chips.appendChild(folderChip(selected.type,folderTypeTone(selected.type)));
      if (selected.kind) chips.appendChild(folderChip(selected.kind,'tone-neutral'));
      if (selected.entity) chips.appendChild(folderChip(selected.entity,'tone-info'));
      detail.appendChild(chips);
      const info = node('div','folder-info');
      const fact = (label,value) => {
        const box = node('div');
        append(box,node('small','',label),node('p','',value || '—'));
        info.appendChild(box);
      };
      fact('Purpose',selected.purpose);
      fact('Parent',parent ? parent.name : 'Drive');
      fact('Domain',selected.domain);
      fact('Entity',selected.entity);
      detail.appendChild(info);
    }
    function renderFolders() {
      app.replaceChildren();
      const hero = header('Locations','Folder structure',
        'Browse the folders recorded in Pipeline Locations and open them in Drive. Search folders from the top bar.');
      const controls = node('div','folder-controls');
      const check = node('button','h-button','Check Drive & update Locations'); check.type = 'button';
      controls.appendChild(check); hero.appendChild(controls);
      const pathBar = node('nav','folder-path'); pathBar.id = 'folder-path';
      pathBar.setAttribute('aria-label','Folder path'); app.appendChild(pathBar);
      const browser = node('div','folder-browser'); browser.id = 'folder-browser';
      app.appendChild(browser);
      renderFolderBrowser();
      check.onclick = () => {
        check.disabled = true; check.textContent = 'Checking Drive…';
        google.script.run.withSuccessHandler(result => {
          folderData = {count:result.count,tree:result.tree};
          folderPath = defaultFolderPath(); clearFolderSearch();
          renderFolders(); renderFolderReport(result);
        }).withFailureHandler(error => {
          check.disabled = false; check.textContent = 'Check Drive & update Locations';
          const message = node('p','folder-error',
            'Folder check stopped: ' + (error.message || String(error)));
          message.setAttribute('role','alert');
          hero.after(message);
        }).checkFoldersAgainstDrive();
      };
    }
    function renderFolderReport(result) {
      const report = node('section','folder-report');
      report.appendChild(node('h3','','Drive check results'));
      function list(title,items,describe) {
        const group = node('div','folder-report-group');
        group.appendChild(node('h4','',title + ' (' + items.length + ')'));
        if (!items.length) group.appendChild(node('p','','None.'));
        else {
          const ul = node('ul');
          items.forEach(item => {
            const li = node('li','',describe(item));
            if (item.url) {
              const href = safeLink(item.url);
              if (href) {
                const a = node('a','','Open folder ↗');
                a.href = href; a.target = '_blank'; a.rel = 'noopener noreferrer';
                li.appendChild(a);
              }
            }
            ul.appendChild(li);
          });
          group.appendChild(ul);
        }
        report.appendChild(group);
      }
      list('Updated in Locations',result.updates,
        item => item.field + ': ' + item.from + ' → ' + item.to);
      list('Needs your attention',result.problems,item => item.message);
      list('In Drive but not in Locations',result.suggestions,
        item => item.name + ' in ' + item.parent + ' (' +
          [item.domain,item.entity].filter(Boolean).join(' / ') + ').');
      app.appendChild(report);
    }
    $('nav-decisions').onclick = () => navigate('decisions');
    $('nav-pipeline').onclick = () => navigate('pipeline');
    $('nav-folders').onclick = () => navigate('folders');
    $('nav-add').onclick = () => navigate('add');
    topSearch.oninput = onTopSearch;
    $('top-search-form').onsubmit = event => { event.preventDefault(); onTopSearch(); };
    // "/" jumps to the top bar's search.
    if (document.addEventListener) document.addEventListener('keydown',event => {
      const target = event.target || {};
      if (event.key !== '/' || /^(INPUT|TEXTAREA|SELECT)$/.test(target.tagName || '') || target.isContentEditable) return;
      event.preventDefault(); topSearch.focus();
    });
    // The first Decisions list comes with the page (doGet); without it the page loads it.
    try {
      const embedded = JSON.parse(($('initial-data') || {}).textContent || 'null');
      if (embedded && Array.isArray(embedded.pending)) { dashboard = embedded; updateNavCount(); }
    } catch (_) { dashboard = null; }
    function start(hash) {
      show(parseHash(hash),false);
      // The Pipeline list loads in the background, so the Pipeline tab opens at once.
      if (!pipelineRows) loadPipeline(false);
    }
    if (google.script.history) google.script.history.setChangeHandler(event =>
      show(event.state && event.state.view ? event.state : parseHash(event.location && event.location.hash),false));
    if (google.script.url) google.script.url.getLocation(location => start(location.hash));
    else start('');
  </script>
</body>
</html>
