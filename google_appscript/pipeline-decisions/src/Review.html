<body>
  <header class="top"><div class="top-inner">
    <div class="brandbar"><div class="brand"><div class="mark" aria-hidden="true">H</div>
      <div><h1>Horology workspace</h1><p>Review decisions and manage Pipeline work</p></div></div>
      <a class="sheet-link" href="https://docs.google.com/spreadsheets/d/1aL678ACs97YpLIGrGU5LbpXHc7jQBxl64ED-sLyehvI/edit" target="_blank" rel="noopener noreferrer">Open Pipeline sheet ↗</a>
    </div>
    <nav class="nav" aria-label="Workspace">
      <button id="nav-decisions" class="active" type="button">Decisions</button>
      <button id="nav-pipeline" type="button">Pipeline</button>
      <button id="nav-folders" type="button">Folders</button>
      <button id="nav-add" type="button">Add Pipeline item</button>

  </div></header>
  <main id="app" class="wrap"><div class="loading">Loading workspace…</div></main>
  <script>
    const $ = id => document.getElementById(id);
    const app = $('app');
    let page = 'decisions', pipelineMode = 'cards',
      dashboard = {pending:[],recent:[]}, pipelineRows = null, pipelineQuery = '',
      pipelineFilters = {'Domain':'','Status':'','Entity':'','Type':'',
        'Agent status':'','Agent type':'','Run location':'','Stage':''},
      filtersExpanded = false, folderData = null, folderPath = [], folderQuery = '',
      folderScroll = {roots:0,children:0},
      selectedId = '', selectedPipelineId = '', formData = null, notice = '';
    function chipTone(value) {
      const label = String(value || '').trim().toLowerCase();
      if (/(?:^|:\s)(needs review|awaiting decision)$/.test(label)) return 'tone-review';
      if (/(?:^|:\s)(accepted|approved|ready|completed)$/.test(label)) return 'tone-success';
      if (/(?:^|:\s)(rework|parked|plan)$/.test(label)) return 'tone-warning';
      if (/(?:^|:\s)(rejected|blocked|failed)$/.test(label)) return 'tone-danger';
      if (/^(stage\s*\d|investigation proposal|specialist deliverable)/.test(label)) return 'tone-stage';
      if (/(?:^|:\s)inbox$/.test(label)) return 'tone-info';
      return 'tone-neutral';
    }
    const node = (tag,className,value) => {
      const element = HorologyUi.element(tag,className,value);
      if (tag === 'span' && /\bh-pill\b/.test(className || ''))
        element.classList.add(chipTone(value));
      return element;
    };
    function chevronIcon() {
      const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
      svg.setAttribute('viewBox','0 0 24 24');
      svg.setAttribute('aria-hidden','true');
      const path = document.createElementNS('http://www.w3.org/2000/svg','path');
      path.setAttribute('d','m6 9 6 6 6-6');
      path.setAttribute('fill','none');
      path.setAttribute('stroke','currentColor');

      path.setAttribute('stroke-linecap','round');
      path.setAttribute('stroke-linejoin','round');

    }
    const append = (parent,...children) => children.forEach(child => parent.appendChild(child));

      const box = node('section','section'); box.appendChild(node('h3','',title));
      if (hint) box.appendChild(node('p','hint',hint));
      parent.appendChild(box); return box;
    };
    const safeLink = raw => {
      try { const url = new URL(raw); return url.protocol === 'https:' ? url.href : ''; }
      catch (_) { return ''; }
    };
    const filterMatches = (value,selected) =>
      !selected || (selected === '__blank__' ? !value : value === selected);
    function filteredPipelineRows(rows,query,filters) {
      const text = query.trim().toLowerCase();
      return rows.filter(item => Object.keys(filters).every(key =>
        filterMatches(item[key],filters[key])) &&
        (!text || ['ID','Title','Domain','Entity','Type','Status','Stage',
          'Agent status','Agent type','Run location','Summary / Why',
          'Next step / Research question'].some(key =>
          String(item[key] || '').toLowerCase().includes(text))));
    }
    function header(eyebrow,title,lead) {

          pipelineRows = rows; renderPipelineList();
        }).withFailureHandler(error => app.replaceChildren(node('div','loading',
          'Could not load Pipeline items: ' + (error.message || String(error))))).getPipelineOverview();
      } else if (to === 'pipeline') renderPipelineList();

        app.replaceChildren(node('div','loading','Loading folders…'));

      } else if (to === 'folders') renderFolders();

        app.replaceChildren(node('div','loading','Loading Pipeline fields…'));

    function renderList() {
      app.replaceChildren();

      const groups = decisionGroups();
      renderGroup('Needs your review',groups.pending,true);
      renderGroup('Decision history',groups.history,false);
      showNotice(notice); notice = '';
    }
    function decisionGroups() {
      const byItem = new Map();
      [...dashboard.pending,...dashboard.recent].forEach(record => {
        if (!byItem.has(record.pipelineId)) byItem.set(record.pipelineId,[]);
        byItem.get(record.pipelineId).push(record);
      });
      const pending = [], history = [];
      byItem.forEach(records => {
        records.sort((a,b) => Number(b.id) - Number(a.id));
        (records.some(record => record.editable) ? pending : history).push(records);
      });
      pending.sort((a,b) => Number(b[0].id) - Number(a[0].id));
      history.sort((a,b) => Number(b[0].id) - Number(a[0].id));
      return {pending,history};
    }
    function renderGroup(title,groups,pending) {
      const heading = node('div','group-title');
      append(heading,node('h3','',title),node('span','count',groups.length +
        (groups.length === 1 ? ' item' : ' items')));

        app.appendChild(node('div','empty',pending ? 'Nothing is awaiting a decision.' : 'No recorded decisions.'));

          node('strong','h-row__title',latest.title),
          node('span','h-row__support',latest.question || 'Open decision history'));
        const foot = node('span','h-row__badges');
        append(foot,node('span','h-pill' + (current ? ' pending' : ''),
          current ? 'Needs review' : latest.status),
          node('span','h-pill',records.length + (records.length === 1 ? ' decision' : ' decisions')));
        const expand = node('button','icon-button decision-expand');
        expand.appendChild(chevronIcon());
        expand.type = 'button'; expand.setAttribute('aria-label','Show decisions for Pipeline ' + latest.pipelineId);
        expand.setAttribute('aria-expanded','false');

        const children = node('div','subrows'); children.hidden = true;
        records.forEach(record => {
          const button = node('button','decision-subrow'); button.type = 'button';
          const label = node('span');
          append(label,node('strong','','Decision ' + record.id + ' · ' + record.stage),
            node('small','',record.question || 'Open decision details'));
          append(button,label,node('span','h-pill' + (record.editable ? ' pending' : ''),
            record.editable ? 'Needs review' : record.status));

    }
    function renderPipelineList() {
      app.replaceChildren();
      const hero = header('Pipeline','All Pipeline items',
        'Browse every Pipeline row. Open one to see its work, status, next step and revisit trigger.');
      const searchBar = node('div','search-bar'), searchWrap = node('div','filter-field search-field');
      const searchLabel = node('label','','Search');
      const search = node('input','h-input'); search.id = 'pipeline-search';
      searchLabel.htmlFor = search.id;
      search.type = 'search'; search.placeholder = 'Search items'; search.value = pipelineQuery;
      append(searchWrap,searchLabel,search); searchBar.appendChild(searchWrap);
      const toggle = node('div','toggle');
      for (const label of ['Cards','Rows']) {
        const button = node('button',pipelineMode === label.toLowerCase() ? 'active' : '',label);
        button.type = 'button';

      const filterControls = {};
      function addFilter(key,parent,rows) {
        const wrap = node('div','filter-field'), label = node('label','',key);
        const select = node('select','h-select');

        label.htmlFor = select.id;
        append(wrap,label,select); parent.appendChild(wrap);
        filterControls[key] = select;
        const values = [...new Set(rows.map(item => item[key] || ''))]
          .sort((a,b) => a.localeCompare(b));
        const all = node('option','','All ' + key.toLowerCase()); all.value = '';
        select.appendChild(all);
        values.forEach(value => {
          const option = node('option','',value || 'No ' + key.toLowerCase());

        });
        if (![...select.options].some(option => option.value === pipelineFilters[key]))

        select.onchange = () => {
          pipelineFilters[key] = select.value;
          if (key === 'Domain') {
            pipelineFilters.Entity = '';

              const subset = (pipelineRows || []).filter(item =>
                !pipelineFilters.Domain || filterMatches(item.Domain,pipelineFilters.Domain));
              entity.replaceChildren();
              const allEntity = node('option','','All entity'); allEntity.value = '';
              entity.appendChild(allEntity);
              [...new Set(subset.map(item => item.Entity || ''))]

                  const option = node('option','',value || 'No entity');

                });

      addFilter('Domain',searchBar,pipelineRows || []);
      addFilter('Status',searchBar,pipelineRows || []);
      const clear = node('button','h-button','Clear filters'); clear.type = 'button';
      clear.onclick = () => {

        renderPipelineList();
      };
      const actions = node('div','filter-actions'); actions.appendChild(clear); searchBar.appendChild(actions);
      app.appendChild(searchBar);
      const more = node('details','filter-panel'), moreLabel = node('summary','','More filters');
      more.open = filtersExpanded;
      more.ontoggle = () => { filtersExpanded = more.open; };
      const filterGrid = node('div','filter-grid');
      append(more,moreLabel,filterGrid); app.appendChild(more);
      const entityRows = (pipelineRows || []).filter(item =>
        filterMatches(item.Domain,pipelineFilters.Domain));
      addFilter('Entity',filterGrid,entityRows);
      for (const key of ['Type','Agent status','Agent type','Run location','Stage'])
        addFilter(key,filterGrid,pipelineRows || []);
      const heading = node('div','group-title'), count = node('span','count');
      append(heading,node('h3','','Pipeline items'),count); app.appendChild(heading);
      const list = node('div','collection ' + pipelineMode); app.appendChild(list);
      function updateResults() {
        const rows = filteredPipelineRows(pipelineRows || [],pipelineQuery,pipelineFilters);
        const active = Object.entries(pipelineFilters)

          append(button,node('span',rowMode ? 'id h-row__id' : 'id','Pipeline ' + item.ID),
            node('strong',rowMode ? 'h-row__title' : '',item.Title || 'Untitled item'),
            node('span',rowMode ? 'question h-row__support' : 'question',

              'Open item details'));

    function renderPipelineDetail() {

      back.onclick = renderPipelineList;

      const panel = node('article','panel'); app.appendChild(panel);
      const head = node('div','panel-head');
      append(head,node('div','eyebrow','Pipeline ' + item.ID + ' · ' + item.Domain),

      };

        ['Summary / Why',item['Summary / Why']],
        ['Next step / Research question',item['Next step / Research question']],

      const linkRow = node('div','links');
      for (const pair of [
        ['Open Pipeline row ↗',item.sheetUrl],
        ['Open work target ↗',item.URL],
        ['Open ClickUp task ↗',item['ClickUp Pipeline URL']]

        const href = safeLink(pair[1]); if (!href) continue;

        a.rel = 'noopener noreferrer'; linkRow.appendChild(a);
      }
      links.appendChild(linkRow);

    function renderPipelineEdit() {

          'Revisit trigger':trigger.control.value,
          'Agent status':agentStatus.control.value,

        }};
        google.script.run.withSuccessHandler(result => {
          google.script.run.withSuccessHandler(rows => {
            pipelineRows = rows; renderPipelineDetail();
            showNotice(result.changed ? 'Pipeline item saved.' : 'No changes to save.');
          }).withFailureHandler(error => {
            message.className = 'message error';
            message.textContent = 'Saved, but could not refresh: ' + (error.message || String(error));
            save.disabled = false;
          }).getPipelineOverview();
        }).withFailureHandler(error => {
          message.className = 'message error';
          message.textContent = error.message || String(error); save.disabled = false;
        }).updatePipelineItemFromWeb(payload);
      };
    }
    function defaultWording(record,code) {
      if (code === 'OTHER') return '';
      const option = record.options.find(o => o.code === code);
      if (code === 'PROPOSAL' || (option && option.recommended))
        return record.proposal.replace(/^\s*Proposed\s*:/i,'Accepted:').trim();
      return option ? 'Accepted: ' + option.context.replace(/[.;]+$/,'') +
        ' (Option ' + code + ').' : '';
    }
    function renderDetail() {
      const r = [...dashboard.pending,...dashboard.recent].find(x => x.id === selectedId);
      if (!r) { renderList(); return; }
      app.replaceChildren();
      const back = node('button','back icon-button','←'); back.type = 'button';
      back.setAttribute('aria-label','Back to all decisions'); back.title = 'All decisions';
      back.onclick = renderList;
      const toolbar = node('div','detail-toolbar'); toolbar.appendChild(back); app.appendChild(toolbar);
      const panel = node('article','panel'); app.appendChild(panel);
      const head = node('div','panel-head');
      append(head,node('div','eyebrow','Decision ' + r.id + ' · ' + r.domain),
        node('h2','',r.question || r.title));
      const meta = node('div','meta');
      append(meta,node('span','h-pill' + (r.editable ? ' pending' : ''),r.editable ? 'Needs review' : r.status),
        node('span','h-pill',r.stage),node('span','h-pill','Pipeline ' + r.pipelineId));
      head.appendChild(meta); panel.appendChild(head);
      const body = node('div','panel-body'); panel.appendChild(body);

      const saved = section(body,r.editable ? 'Proposal' : 'Recorded decision');
      saved.appendChild(node('p','plain-copy',r.proposal || 'No decision text recorded.'));
      const why = section(body,'Reason');
      why.appendChild(node('p','plain-copy',r.reason || 'No reason recorded.'));
      if (r.reviewTrigger) {
        const revisit = section(body,'Revisit trigger');
        revisit.appendChild(node('p','plain-copy',r.reviewTrigger));
      }
      if (r.editable) renderDecisionForm(body,r);
      if (r.links.length) {
        const sources = section(body,'Evidence');
        const links = node('div','links');
        r.links.forEach((raw,i) => {
          const href = safeLink(raw); if (!href) return;
          const a = node('a','',r.links.length === 1 ? 'Open evidence ↗' : 'Evidence ' + (i+1) + ' ↗');
          a.href = href; a.target = '_blank'; a.rel = 'noopener noreferrer'; links.appendChild(a);
        });
        sources.appendChild(links);
      }
    }
    function renderDecisionForm(body,r) {
      const form = node('form'); body.appendChild(form);
      const choices = section(form,'Choose an option',
        'The model suggestion is marked. You can select another option without requesting rework.');
      const choiceGrid = node('div','choices'); choices.appendChild(choiceGrid);
      const listed = r.options.length ? r.options : [{code:'PROPOSAL',context:'Use the proposal',recommended:true}];
      [...listed,{code:'OTHER',context:'Describe a different choice',recommended:false}].forEach(o => {
        const label = node('label','choice'), input = node('input');
        input.type = 'radio'; input.name = 'option'; input.value = o.code;
        if (o.recommended) input.checked = true;
        append(label,input,node('strong','',o.code === 'OTHER' ? 'Another option' :
          o.code === 'PROPOSAL' ? 'Use proposal' : 'Option ' + o.code),
          node('span','',o.context));
        if (o.recommended) label.appendChild(node('em','','Model suggests'));
        choiceGrid.appendChild(label);
      });
      const action = section(form,'Record your decision');
      const grid = node('div','grid'); action.appendChild(grid);
      const outcomeField = field(grid,'Outcome','outcome','select');
      const outcome = outcomeField.control;
      [['accepted','Approve chosen option'],['rework','Request rework'],
        ['parked','Park for now'],['rejected','Reject']].forEach(pair => {
          const option = node('option','',pair[1]); option.value = pair[0]; outcome.appendChild(option);
        });
      const wordingField = field(grid,'Decision to record','wording','textarea','wide');
      wordingField.control.rows = 4; wordingField.control.maxLength = 4000;
      wordingField.hint.textContent = 'Edit the wording if your choice has conditions or limits.';
      const noteField = field(grid,'Your reason or instructions','note','textarea','wide');
      noteField.control.rows = 3; noteField.control.maxLength = 3000;
      noteField.control.placeholder = 'One or two sentences are enough.';
      const bar = node('div','actions'), save = node('button','h-button h-button--primary','Save decision');
      save.type = 'submit'; const message = node('span','message');
      append(bar,save,message); form.appendChild(bar);
      const checked = () => form.querySelector('input[name="option"]:checked');
      function update() {
        const accepting = outcome.value === 'accepted';
        choices.hidden = !accepting; wordingField.wrap.hidden = !accepting;
        noteField.label.textContent = outcome.value === 'rework' ? 'Rework instructions' :
          accepting ? 'Your reason (required for a different option)' : 'Why this outcome?';
        if (accepting && checked()) wordingField.control.value = defaultWording(r,checked().value);
      }
      form.querySelectorAll('input[name="option"]').forEach(el => el.onchange = update);
      outcome.onchange = update; update();
      form.onsubmit = event => {
        event.preventDefault(); save.disabled = true;
        message.className = 'message'; message.textContent = 'Saving…';
        const chosen = checked();
        const payload = {decisionId:r.id,version:r.version,action:outcome.value,
          optionCode:chosen ? chosen.value : '',wording:wordingField.control.value,
          note:noteField.control.value};
        google.script.run.withSuccessHandler(result => {
          pipelineRows = null;
          notice = result.warning || (result.applied ?
            'Decision saved and Pipeline updated.' : 'Decision saved.');
          loadDashboard(() => renderList());
        }).withFailureHandler(error => {
          message.className = 'message error';
          message.textContent = error && error.message ? error.message : String(error);
          save.disabled = false;
        }).submitDecisionReview(payload);
      };
    }
    function field(parent,labelText,id,type,extra) {
      const wrap = node('div','field' + (extra ? ' ' + extra : ''));
      const label = node('label','',labelText); label.htmlFor = id;
      const hint = node('small');
      const control = node(type,type === 'input' ? 'h-input' :
        type === 'select' ? 'h-select' : 'h-textarea'); control.id = id;
      append(wrap,label,hint,control); parent.appendChild(wrap);
      return {wrap,label,hint,control};
    }
    function fill(select,values,blank) {
      select.replaceChildren();
      (blank ? [''] : []).concat(values || []).forEach(value => {
        const option = node('option','',value || '—'); option.value = value; select.appendChild(option);
      });
    }
    function renderAdd() {
      app.replaceChildren();
      header('Pipeline capture','Add a Pipeline item',
        'Capture the work here. The item is written to Pipeline Master with a permanent ID.');
      const panel = node('div','panel'), form = node('form','panel-body');
      panel.appendChild(form); app.appendChild(panel);
      const essentials = section(form,'The work','Start with the idea and why it matters.');
      const eGrid = node('div','grid'); essentials.appendChild(eGrid);
      const title = field(eGrid,'Title','item-title','input','wide'); title.control.required = true; title.control.maxLength = 240;
      const domain = field(eGrid,'Domain','item-domain','select'); domain.control.required = true;
      const entity = field(eGrid,'Entity','item-entity','select');
      const type = field(eGrid,'Type','item-type','select');
      const summary = field(eGrid,'Summary / Why','item-summary','textarea','wide');
      summary.control.rows = 3; summary.control.maxLength = 4000;
      fill(domain.control,Object.keys(formData.domains),true);
      fill(type.control,formData.options.Type,true);
      function updateEntities() {
        fill(entity.control,formData.domains[domain.control.value] || [],true);
        entity.wrap.hidden = !(formData.domains[domain.control.value] || []).length;
      }
      domain.control.onchange = updateEntities; updateEntities();
      const next = section(form,'What happens next',
        'Choose Ready only if an agent can start from the question below.');
      const nGrid = node('div','grid'); next.appendChild(nGrid);
      const agentStatus = field(nGrid,'Agent status','item-agent-status','select');
      const agentType = field(nGrid,'Agent type','item-agent-type','select');
      const runLocation = field(nGrid,'Run location','item-run-location','select');
      const question = field(nGrid,'Next step / Research question','item-question','textarea','wide');
      question.control.rows = 3; question.control.maxLength = 4000;
      fill(agentStatus.control,formData.options['Agent status'],false);
      fill(agentType.control,formData.options['Agent type'],false);
      fill(runLocation.control,formData.options['Run location'],true);
      agentStatus.control.value = 'No action'; agentType.control.value = 'Unassigned';
      function updateReady() {
        question.hint.textContent = agentStatus.control.value === 'Ready' ?
          'Required for a Ready item.' : 'Optional at capture.';
      }
      agentStatus.control.onchange = updateReady; updateReady();
      const more = node('details','more');
      more.appendChild(node('summary','','Work target and revisit trigger'));
      const mGrid = node('div','grid'); more.appendChild(mGrid);
      const trigger = field(mGrid,'Revisit trigger','item-trigger','input','wide');
      const linkType = field(mGrid,'Link type','item-link-type','select');
      const url = field(mGrid,'URL','item-url','input'); url.control.type = 'url';
      const branch = field(mGrid,'GitHub branch','item-branch','input','wide');
      fill(linkType.control,formData.options['Link type'],true);
      form.appendChild(more);
      const bar = node('div','actions'), save = node('button','h-button h-button--primary','Add item');
      save.type = 'submit'; const message = node('span','message');
      append(bar,save,message); form.appendChild(bar);
      form.onsubmit = event => {
        event.preventDefault(); save.disabled = true;
        message.className = 'message'; message.textContent = 'Adding…';
        const payload = {'Title':title.control.value,'Domain':domain.control.value,
          'Entity':entity.control.value,'Type':type.control.value,
          'Summary / Why':summary.control.value,
          'Next step / Research question':question.control.value,
          'Revisit trigger':trigger.control.value,
          'Agent status':agentStatus.control.value,'Agent type':agentType.control.value,
          'Run location':runLocation.control.value,'Link type':linkType.control.value,
          'URL':url.control.value,'GitHub branch':branch.control.value};
        google.script.run.withSuccessHandler(result => {
          pipelineRows = null;
          form.reset(); agentStatus.control.value = 'No action'; agentType.control.value = 'Unassigned';
          updateEntities(); updateReady();
          message.className = 'message ok';
          message.textContent = 'Added Pipeline item ' + result.id + ' · ' + result.title +
            ' (' + result.stage + '). You can add another.';
          save.disabled = false; title.control.focus();
        }).withFailureHandler(error => {
          message.className = 'message error';
          message.textContent = error && error.message ? error.message : String(error);
          save.disabled = false;
        }).addPipelineItemFromWeb(payload);
      };
    }
    function folderChip(value,tone) {
      const chip = node('span','',value);
      chip.className = 'h-pill ' + tone;
      return chip;
    }
    function folderTypeTone(type) {
      if (type === 'Agent output') return 'tone-success';
      if (type === 'Agent reference') return 'tone-info';
      if (type === 'Hub' || type === 'Node') return 'tone-stage';
      return 'tone-neutral';
    }
    function folderRoots() {
      return [...(folderData.tree.roots || []),...(folderData.tree.unplaced || [])];
    }
    function defaultFolderPath() {
      const root = folderRoots()[0];
      return root ? [root,...(root.children || []).slice(0,1)] : [];
    }
    function renderFolderBrowser() {
      const browser = $('folder-browser');
      browser.replaceChildren();
      const pathBar = $('folder-path');
      pathBar.replaceChildren();
      const crumb = (label,path,current) => {
        const button = node('button','folder-crumb',label);
        button.type = 'button';
        if (current) button.setAttribute('aria-current','page');
        button.onclick = () => { folderPath = path; folderQuery = '';
          $('folder-search').value = ''; renderFolderBrowser(); };
        return button;
      };
      pathBar.appendChild(crumb('All folders',[],!folderPath.length));
      folderPath.forEach((item,index) => {
        append(pathBar,node('span','','›'),
          crumb(item.name || 'Unnamed folder',folderPath.slice(0,index + 1),
            index === folderPath.length - 1));
      });
      const roots = folderRoots();
      if (folderQuery) {
        const results = node('section','folder-results');
        results.appendChild(node('h3','','Search results'));
        let count = 0;
        function visit(item,path) {
          const next = [...path,item];
          const text = [item.name,item.purpose,item.type,item.domain,item.entity,item.kind]
            .join(' ').toLowerCase();
          if (text.includes(folderQuery)) {
            count++;
            const button = node('button','folder-row'); button.type = 'button';
            const copy = node('span','folder-row-name');
            append(copy,node('strong','',item.name || 'Unnamed folder'),
              node('span','folder-result-path',next.map(part => part.name).join(' › ')));
            append(button,copy,node('span','folder-row-arrow','›'));
            button.onclick = () => { folderPath = next; folderQuery = '';
              $('folder-search').value = ''; renderFolderBrowser(); };
            results.appendChild(button);
          }
          (item.children || []).forEach(child => visit(child,next));
        }
        roots.forEach(root => visit(root,[]));
        if (!count) results.appendChild(node('p','empty','No matching folders.'));
        browser.appendChild(results); return;
      }
      const column = (title,key) => {
        const panel = node('section','folder-column');
        const list = node('div','folder-column-scroll');
        list.setAttribute('role','region');
        list.setAttribute('aria-label',title);
        append(panel,node('h3','',title),list);
        browser.appendChild(panel);
        list.onscroll = () => { folderScroll[key] = list.scrollTop; };
        return list;
      };
      function folderRow(item,selected,onClick) {
        const button = node('button','folder-row' + (selected ? ' selected' : ''));
        button.type = 'button';
        if (selected) button.setAttribute('aria-current','true');
        append(button,node('span','folder-row-name',item.name || 'Unnamed folder'),
          node('span','folder-row-arrow',(item.children || []).length ? '›' : ''));
        button.onclick = onClick;
        return button;
      }
      const domains = column('Domains and roots','roots');
      (folderData.tree.roots || []).forEach(root => domains.appendChild(
        folderRow(root,folderPath[0] === root,() => {
          folderPath = [root]; folderScroll.children = 0;
          renderFolderBrowser(); })));
      if ((folderData.tree.unplaced || []).length) {
        domains.appendChild(node('p','folder-group-label','Parent not found'));
        folderData.tree.unplaced.forEach(root => domains.appendChild(
          folderRow(root,folderPath[0] === root,() => {
            folderPath = [root]; folderScroll.children = 0;
            renderFolderBrowser(); })));
      }
      if (!roots.length) domains.appendChild(node('p','empty','No folders are listed in Locations.'));
      const selected = folderPath[folderPath.length - 1];
      const parent = folderPath[folderPath.length - 2];
      const listingParent = selected && (selected.children || []).length ? selected : parent;
      const children = column(listingParent ? 'Inside ' + (listingParent.name || 'folder') :
        'Choose a folder','children');
      if (listingParent) {
        listingParent.children.forEach(child => children.appendChild(
          folderRow(child,selected === child,() => {
            if ((child.children || []).length) folderScroll.children = 0;
            folderPath = listingParent === selected ? [...folderPath,child] :
              [...folderPath.slice(0,-1),child];
            renderFolderBrowser(); })));
      }
      if (!listingParent || !listingParent.children.length)
        children.appendChild(node('p','empty',selected ? 'No subfolders recorded.' :
          'Select a root folder to browse its contents.'));
      domains.scrollTop = folderScroll.roots;
      children.scrollTop = folderScroll.children;
      const detail = node('section','folder-detail'); browser.appendChild(detail);
      if (!selected) {
        detail.appendChild(node('p','empty','Select a folder to see its details.'));
        return;
      }
      const head = node('div','folder-detail-head');
      const title = node('div');
      append(title,node('span','eyebrow','Selected folder'),
        node('h3','',selected.name || 'Unnamed folder'));
      head.appendChild(title);
      const href = safeLink(selected.url);
      if (href) {
        const link = node('a','h-button','Open in Drive ↗');
        link.href = href; link.target = '_blank'; link.rel = 'noopener noreferrer';
        head.appendChild(link);
      }
      detail.appendChild(head);
      const chips = node('div','folder-chips');
      if (selected.type) chips.appendChild(folderChip(selected.type,folderTypeTone(selected.type)));
      if (selected.kind) chips.appendChild(folderChip(selected.kind,'tone-neutral'));
      if (selected.entity) chips.appendChild(folderChip(selected.entity,'tone-info'));
      detail.appendChild(chips);
      const info = node('div','folder-info');
      const fact = (label,value) => {
        const box = node('div');
        append(box,node('small','',label),node('p','',value || '—'));
        info.appendChild(box);
      };
      fact('Purpose',selected.purpose);
      fact('Parent',parent ? parent.name : 'Drive');
      fact('Domain',selected.domain);
      fact('Entity',selected.entity);
      detail.appendChild(info);
    }
    function renderFolders() {
      app.replaceChildren();
      header('Locations','Folder structure',
        'Browse the folders recorded in Pipeline Locations and open them in Drive.');
      const controls = node('div','folder-controls');
      const searchWrap = node('div','filter-field search-field');
      const label = node('label','','Search folders');
      const search = node('input','h-input'); search.type = 'search';
      search.id = 'folder-search'; search.placeholder = 'Name, purpose or type';
      search.value = folderQuery;
      label.htmlFor = search.id; append(searchWrap,label,search);
      const check = node('button','h-button','Check Drive & update Locations'); check.type = 'button';
      append(controls,searchWrap,check); app.appendChild(controls);
      const pathBar = node('nav','folder-path'); pathBar.id = 'folder-path';
      pathBar.setAttribute('aria-label','Folder path'); app.appendChild(pathBar);
      const browser = node('div','folder-browser'); browser.id = 'folder-browser';
      app.appendChild(browser);
      renderFolderBrowser();
      search.oninput = () => { folderQuery = search.value.trim().toLowerCase();
        renderFolderBrowser(); };
      check.onclick = () => {
        check.disabled = true; check.textContent = 'Checking Drive…';
        google.script.run.withSuccessHandler(result => {
          folderData = {count:result.count,tree:result.tree};
          folderPath = defaultFolderPath(); folderQuery = '';
          renderFolders(); renderFolderReport(result);
        }).withFailureHandler(error => {
          check.disabled = false; check.textContent = 'Check Drive & update Locations';
          const message = node('p','folder-error',
            'Folder check stopped: ' + (error.message || String(error)));
          controls.after(message);
        }).checkFoldersAgainstDrive();
      };
    }
    function renderFolderReport(result) {
      const report = node('section','folder-report');
      report.appendChild(node('h3','','Drive check results'));
      function list(title,items,describe) {
        const group = node('div','folder-report-group');
        group.appendChild(node('h4','',title + ' (' + items.length + ')'));
        if (!items.length) group.appendChild(node('p','','None.'));
        else {
          const ul = node('ul');
          items.forEach(item => {
            const li = node('li','',describe(item));
            if (item.url) {
              const href = safeLink(item.url);
              if (href) {
                const a = node('a','','Open folder ↗');
                a.href = href; a.target = '_blank'; a.rel = 'noopener noreferrer';
                li.appendChild(a);
              }
            }
            ul.appendChild(li);
          });
          group.appendChild(ul);
        }
        report.appendChild(group);
      }
      list('Updated in Locations',result.updates,
        item => item.field + ': ' + item.from + ' → ' + item.to);
      list('Needs your attention',result.problems,item => item.message);
      list('In Drive but not in Locations',result.suggestions,
        item => item.name + ' in ' + item.parent + ' (' +
          [item.domain,item.entity].filter(Boolean).join(' / ') + ').');
      app.appendChild(report);
    }
    function loadDashboard(done) {
      google.script.run.withSuccessHandler(result => {
        dashboard = result; done();
      }).withFailureHandler(error => {
        app.replaceChildren(node('div','loading','Could not load decisions: ' +
          (error && error.message ? error.message : String(error))));
      }).getReviewDashboard();
    }
    $('nav-decisions').onclick = () => navigate('decisions');
    $('nav-pipeline').onclick = () => navigate('pipeline');
    $('nav-folders').onclick = () => navigate('folders');
    $('nav-add').onclick = () => navigate('add');
    loadDashboard(renderList);
  </script>
</body>
</html>
